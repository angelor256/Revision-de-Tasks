function renderBriefing(){
  $('#tools').hidden = true;
  const max = bMax();
  const rail = '<nav class="rail" aria-label="Pasos">' + B_STEPS.map((s, i) => {
    const n = i + 1, cur = B.step === n, done = n < B.step && n <= max;
    return '<button class="rs' + (done ? ' done' : '') + '" data-act="b-go" data-s="' + n + '"' + (cur ? ' aria-current="step"' : '') + (n > max ? ' disabled' : '') + '><i>' + (done ? CHECK : n) + '</i>' + s + '</button>';
  }).join('') + '</nav>';
  const sy = window.scrollY;
  app.innerHTML = '<div class="bw">' + rail + '<div class="bmain">' + bStepHTML() + '</div></div>' + bBarHTML();
  if (B.step === 6) window.scrollTo(0, sy);
  if (B.step === 4){
    const drop = $('#bdrop'); if (!drop) return;
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    $('#bpick').addEventListener('click', () => $('#bfile').click());
  }
}

/* ---------- descargas ---------- */
const bFileBase = () => (B.title.trim() || 'Briefing').replace(/[^\w\- áéíóúñÁÉÍÓÚÑ]+/g, '').trim().slice(0, 60) || 'Briefing';
const pdfT = s => String(s == null ? '' : s).replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/→/g, '->').replace(/…/g, '...');
function bAttRows(){
  const rows = [];
  B.plan.sessions.forEach(s => s.members.forEach(m => rows.push({ s, r: m.rec, soft: m.soft || [], warn: m.warn })));
  return rows;
}
/* ---------- Excel con formato ---------- */
const XL_INK = 'FF101B33', XL_BLUE = 'FF2F5BEA', XL_MUT = 'FF566280', XL_LINE = 'FFD4DAE6', XL_SOFT = 'FFF4F6FA';
const XL_DAY = ['FF2F5BEA', 'FF0A7F64', 'FFA82B7C', 'FFA36405', 'FF3F5BA9', 'FF5F6A8A', 'FFD3263A'];
const XL_Q = { Phones: 'FF2F5BEA', Chats: 'FF0A7F64', Tickets: 'FFA36405', Casino: 'FFA82B7C' };
function xlTint(h, k){
  const c = [2, 4, 6].map(i => parseInt(h.slice(i, i + 2), 16));
  return 'FF' + c.map(v => Math.round(v + (255 - v) * k).toString(16).padStart(2, '0')).join('').toUpperCase();
}
async function bXlsx(){
  if (!S.dl) return;
  if (!window.ExcelJS) return bXlsxPlain();
  try{
    const P = B.plan, placed = P.sessions.reduce((n, s) => n + s.members.length, 0);
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Revisor de breaks'; wb.created = new Date();
    const thin = { style: 'thin', color: { argb: XL_LINE } }, box = { top: thin, left: thin, bottom: thin, right: thin };
    const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
    const font = (o) => Object.assign({ name: 'Calibri', size: 11, color: { argb: XL_INK } }, o || {});
    const lines = (txt, chars) => String(txt || '').split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(l.length / chars)), 0);
    const setup = ws => { ws.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.3, footer: 0.3 } }; };
    const headRow = (ws, r, labels, argb) => {
      const row = ws.getRow(r); row.height = 26;
      labels.forEach((t, i) => { const c = row.getCell(i + 1); c.value = t; c.font = font({ bold: true, color: { argb: 'FFFFFFFF' } }); c.fill = fill(argb || XL_INK); c.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 }; c.border = box; });
    };

    /* ===== Hoja 1: Resumen ===== */
    const ws = wb.addWorksheet('Resumen', { views: [{ showGridLines: false }], properties: { tabColor: { argb: XL_BLUE } } });
    setup(ws);
    ws.columns = [{ width: 24 }, { width: 24 }, { width: 12 }, { width: 11 }, { width: 60 }, { width: 46 }];
    ws.mergeCells('A1:F1');
    let c = ws.getCell('A1'); c.value = B.title; c.font = font({ size: 24, bold: true, color: { argb: 'FFFFFFFF' } }); c.fill = fill(XL_INK); c.alignment = { vertical: 'middle', indent: 1 }; ws.getRow(1).height = 46;
    ws.mergeCells('A2:F2');
    c = ws.getCell('A2'); c.value = 'Briefing para ' + B.areas.join(', ') + ', ' + B.dur + ' min por sesión'; c.font = font({ size: 12, color: { argb: 'FFC9D3EA' } }); c.fill = fill('FF1E2D52'); c.alignment = { vertical: 'middle', indent: 1 }; ws.getRow(2).height = 26;
    ws.getRow(3).height = 10;
    const when = bWhenText();
    const info = [
      ['Estado', B.approved ? 'APROBADO' : 'Pendiente de aprobación', B.approved ? 'FF1B7F4F' : 'FFB87408', B.approved ? 'FFDDF3E7' : 'FFFBF0DA'],
      ['Resultado', 'Entran ' + placed + ' de ' + P.total + ' personas en ' + P.sessions.length + ' sesiones.' + (P.unplaced.length ? ' Faltan ' + P.unplaced.length + ' por agendar (están al final de esta hoja).' : ' Todos tienen horario.')],
      ['Cuándo', when.charAt(0).toUpperCase() + when.slice(1) + '. Nunca en la primera ni en la última hora del turno de cada persona.'],
      ['Mínimo por sesión', B.min + ' ' + pl(B.min, 'persona', 'personas')],
      ['Áreas', B.areas.join(', ')]
    ];
    info.forEach((x, i) => {
      const r = 4 + i; ws.mergeCells('B' + r + ':F' + r);
      const a = ws.getCell('A' + r); a.value = x[0]; a.font = font({ bold: true, color: { argb: XL_MUT } }); a.alignment = { vertical: 'middle', indent: 1 };
      const v = ws.getCell('B' + r); v.value = x[1]; v.font = font({ bold: !!x[2], color: { argb: x[2] || XL_INK } }); v.alignment = { vertical: 'middle', wrapText: true, indent: 1 };
      if (x[3]) v.fill = fill(x[3]);
      ws.getRow(r).height = x[0] === 'Cuándo' ? 36 : 24;
      ['A', 'B', 'C', 'D', 'E', 'F'].forEach(col => { ws.getCell(col + r).border = { bottom: thin }; });
    });
    let r = 4 + info.length + 1;
    ws.getRow(r - 1).height = 12;
    // calendario
    ws.mergeCells('A' + r + ':F' + r);
    c = ws.getCell('A' + r); c.value = 'Calendario de sesiones'; c.font = font({ size: 16, bold: true }); c.alignment = { vertical: 'middle' };
    ['A', 'B', 'C', 'D', 'E', 'F'].forEach(col => { ws.getCell(col + r).border = { bottom: { style: 'medium', color: { argb: XL_BLUE } } }; });
    ws.getRow(r).height = 30; r++;
    headRow(ws, r, ['Día', 'Hora', 'Duración', 'Personas', 'Quién asiste (cola entre paréntesis)', 'Nota']); r++;
    if (!P.sessions.length){
      ws.mergeCells('A' + r + ':F' + r); c = ws.getCell('A' + r); c.value = 'No se pudo armar ninguna sesión con estos datos. Mira la hoja Recomendaciones.'; c.font = font({ italic: true, color: { argb: XL_MUT } }); c.alignment = { indent: 1, vertical: 'middle' }; ws.getRow(r).height = 28; r++;
    }
    P.sessions.forEach(s => {
      const dc = XL_DAY[s.di % XL_DAY.length], row = ws.getRow(r);
      const names = s.members.map(m => '•  ' + m.rec.name + '  (' + (m.rec.queue || 'sin cola') + ')' + (m.warn ? '   ¡Aviso: ' + m.warn + '!' : '')).join('\n') || '(sin personas)';
      const note = [((s.cap || 1) > 1 ? 'Regla relajada: salen a la vez hasta ' + s.cap + ' de la misma cola o de Processing. Revisa que haya cobertura.' : ''), (s.members.length < B.min ? 'Menos del mínimo de ' + B.min + ' personas.' : ''), ...s.members.filter(m => m.soft && m.soft.length).map(m => m.soft[0])].filter(Boolean).join('\n');
      const vals = [bDayName(s.day), fmt(s.start) + ' a ' + fmt(s.end), (s.end - s.start) + ' min', s.members.length, names, note];
      vals.forEach((v, i) => { const cell = row.getCell(i + 1); cell.value = v; cell.border = box; cell.alignment = { vertical: 'middle', wrapText: true, horizontal: i === 2 || i === 3 ? 'center' : 'left', indent: i === 2 || i === 3 ? 0 : 1 }; cell.font = font(); });
      const a = row.getCell(1); a.fill = fill(xlTint(dc, 0.82)); a.font = font({ bold: true, size: 12, color: { argb: dc } });
      row.getCell(2).font = font({ bold: true, size: 12 });
      row.getCell(4).font = font({ bold: true });
      row.getCell(6).font = font({ size: 10, color: { argb: note ? 'FFB87408' : XL_MUT } });
      row.height = Math.max(26, Math.max(s.members.length || 1, lines(note, 52)) * 17 + 10);
      r++;
    });
    // faltan
    r++;
    ws.mergeCells('A' + r + ':F' + r);
    const miss = P.unplaced.length;
    c = ws.getCell('A' + r); c.value = 'Personas que faltan por agendar (' + miss + ')'; c.font = font({ size: 16, bold: true, color: { argb: miss ? 'FFD3263A' : 'FF1B7F4F' } }); c.alignment = { vertical: 'middle' };
    ['A', 'B', 'C', 'D', 'E', 'F'].forEach(col => { ws.getCell(col + r).border = { bottom: { style: 'medium', color: { argb: miss ? 'FFD3263A' : 'FF1B7F4F' } } }; });
    ws.getRow(r).height = 30; r++;
    if (miss){
      headRow(ws, r, ['Nombre', 'Área y cola', 'Por qué no entró'], 'FFD3263A'); ws.mergeCells('C' + r + ':F' + r); r++;
      P.unplaced.forEach(u => {
        const row = ws.getRow(r); ws.mergeCells('C' + r + ':F' + r);
        const why = bWhyText(u) + (u.alt ? '. Podría el ' + B.days[u.alt.di].label + ' a las ' + fmt(u.alt.t) + '.' : '.');
        row.getCell(1).value = u.name; row.getCell(1).font = font({ bold: true }); row.getCell(1).fill = fill('FFFBE7EA');
        row.getCell(2).value = u.rec ? u.rec.area + ', ' + (u.rec.queue || 'sin cola') : ''; row.getCell(3).value = why;
        for (let i = 1; i <= 6; i++){ const cell = row.getCell(i); cell.border = box; cell.alignment = { vertical: 'middle', wrapText: true, indent: i === 1 || i === 2 || i === 3 ? 1 : 0 }; }
        row.getCell(3).font = font({ size: 10 });
        row.height = Math.max(26, lines(why, 118) * 15 + 10);
        r++;
      });
    } else {
      ws.mergeCells('A' + r + ':F' + r); c = ws.getCell('A' + r); c.value = 'Nadie falta: todas las personas elegidas tienen horario.'; c.font = font({ bold: true, color: { argb: 'FF1B7F4F' } }); c.fill = fill('FFDDF3E7'); c.alignment = { indent: 1, vertical: 'middle' }; ws.getRow(r).height = 28; r++;
    }
    // cómo leerlo
    r++;
    ws.mergeCells('A' + r + ':F' + r); c = ws.getCell('A' + r); c.value = 'Cómo leer este archivo'; c.font = font({ size: 13, bold: true, color: { argb: XL_MUT } }); ws.getRow(r).height = 24; r++;
    ['Cada fila del calendario es una sesión: el día, la hora y las personas que asisten con su cola entre paréntesis.',
     'Regla relajada: en esa sesión salen a la vez 2 o 3 personas de la misma cola (o de Processing) para poder llegar al mínimo. Conviene revisar que haya cobertura.',
     'Hoja “Por persona”: cada asistente con su día, hora, breaks y turno, ordenado por nombre. Hoja “Faltan”: quienes no tienen horario; sirve para armar el siguiente training solo con ellos.'
    ].forEach(t => { ws.mergeCells('A' + r + ':F' + r); const cell = ws.getCell('A' + r); cell.value = t; cell.font = font({ size: 10, color: { argb: XL_MUT }, italic: true }); cell.alignment = { wrapText: true, vertical: 'top', indent: 1 }; ws.getRow(r).height = 30; r++; });

    /* ===== Hoja 2: Por persona ===== */
    const wp = wb.addWorksheet('Por persona', { views: [{ state: 'frozen', xSplit: 1, ySplit: 1, showGridLines: false }] });
    setup(wp);
    wp.columns = [{ width: 28 }, { width: 14 }, { width: 18 }, { width: 38 }, { width: 15 }, { width: 22 }, { width: 11 }, { width: 11 }, { width: 20 }, { width: 58 }];
    headRow(wp, 1, ['Nombre', 'Área', 'Queue (Main Task)', 'Task (Secondary Task)', 'Día', 'Hora del briefing', 'Break 1', 'Break 2', 'Turno', 'Notas']);
    const att = bAttRows().sort((a, b) => a.r.name.localeCompare(b.r.name));
    att.forEach((x, i) => {
      const row = wp.getRow(i + 2), dc = XL_DAY[x.s.di % XL_DAY.length], q = XL_Q[x.r.queue] || 'FF5F6A8A';

      [x.r.name, x.r.area, x.r.queue || 'sin cola', mainText(x.r) || 'sin task', bDayName(x.s.day), fmt(x.s.start) + ' a ' + fmt(x.s.end), x.r.b1 != null ? fmt(x.r.b1) : '', x.r.b2 != null ? fmt(x.r.b2) : '', fmt(x.r.start) + ' a ' + fmt(x.r.end), note].forEach((v, k) => {
        const cell = row.getCell(k + 1); cell.value = v; cell.border = box; cell.font = font(); cell.alignment = { vertical: 'middle', wrapText: true, indent: k === 6 || k === 7 ? 0 : 1, horizontal: k === 6 || k === 7 ? 'center' : 'left' };
        if (i % 2) cell.fill = fill(XL_SOFT);
      });
      row.getCell(1).font = font({ bold: true });
      row.getCell(3).fill = fill(xlTint(q, 0.85)); row.getCell(3).font = font({ bold: true, color: { argb: q } });
      row.getCell(5).fill = fill(xlTint(dc, 0.82)); row.getCell(5).font = font({ bold: true, color: { argb: dc } });
      row.getCell(6).font = font({ bold: true });
      row.getCell(10).font = font({ size: 10, color: { argb: x.warn ? 'FFD3263A' : 'FFB87408' } });
      row.height = Math.max(24, lines(note, 56) * 14 + 8);
    });
    if (att.length) wp.autoFilter = { from: { row: 1, column: 1 }, to: { row: att.length + 1, column: 10 } };

    /* ===== Hoja 3: Faltan (la primera fila son los títulos, para poder volver a cargarla) ===== */
    const wf = wb.addWorksheet('Faltan', { views: [{ state: 'frozen', ySplit: 1, showGridLines: false }], properties: { tabColor: { argb: miss ? 'FFD3263A' : 'FF1B7F4F' } } });
    setup(wf);
    wf.columns = [{ width: 28 }, { width: 14 }, { width: 18 }, { width: 100 }, { width: 22 }];
    headRow(wf, 1, ['Nombre', 'Área', 'Queue (Main Task)', 'Motivo', 'Alternativa'], miss ? 'FFD3263A' : 'FF1B7F4F');
    if (miss) P.unplaced.forEach((u, i) => {
      const row = wf.getRow(i + 2), why = bWhyText(u);
      [u.name, u.rec ? u.rec.area : '', u.rec ? u.rec.queue : '', why, u.alt ? B.days[u.alt.di].label + ' ' + fmt(u.alt.t) : ''].forEach((v, k) => {
        const cell = row.getCell(k + 1); cell.value = v; cell.border = box; cell.font = font(); cell.alignment = { vertical: 'middle', wrapText: true, indent: 1 };
      });
      row.getCell(1).font = font({ bold: true }); row.getCell(1).fill = fill('FFFBE7EA');
      row.height = Math.max(24, lines(why, 98) * 15 + 8);
    });
    else { const row = wf.getRow(2); row.getCell(1).value = 'Nadie falta'; row.getCell(1).font = font({ bold: true, color: { argb: 'FF1B7F4F' } }); row.getCell(1).fill = fill('FFDDF3E7'); row.getCell(4).value = 'Todas las personas elegidas tienen horario.'; row.height = 26; }

    /* ===== Hoja 4: Recomendaciones ===== */
    const wr = wb.addWorksheet('Recomendaciones', { views: [{ state: 'frozen', ySplit: 1, showGridLines: false }] });
    setup(wr);
    wr.columns = [{ width: 16 }, { width: 130 }];
    headRow(wr, 1, ['Tipo', 'Recomendación']);
    B.recs.forEach((x, i) => {
      const row = wr.getRow(i + 2), col = x.kind === 'warn' ? 'FFB87408' : x.kind === 'ok' ? 'FF1B7F4F' : XL_BLUE;
      row.getCell(1).value = x.kind === 'warn' ? 'Atención' : x.kind === 'ok' ? 'Todo bien' : 'Sugerencia';
      row.getCell(2).value = x.text;
      [1, 2].forEach(k => { const cell = row.getCell(k); cell.border = box; cell.font = font(); cell.alignment = { vertical: 'middle', wrapText: true, indent: 1, horizontal: 'left' }; });
      row.getCell(1).fill = fill(xlTint(col, 0.86)); row.getCell(1).font = font({ bold: true, color: { argb: col } });
      row.height = Math.max(26, lines(x.text, 125) * 15 + 10);

/* ---------- seguimiento: elegir solo a los que faltan ---------- */
function bApplyNames(names){
  const keys = new Set(names.map(nt)), found = new Set();
  B.people.forEach(p => { if (keys.has(p.key)) found.add(p.key); });
  const miss = names.filter(n => !found.has(nt(n)));
  if (!found.size){ B.impMsg = 'No encontré a ninguna de esas personas entre las áreas elegidas. Revisa los nombres o el área.'; render(); return; }
  B.people.forEach(p => { p.on = found.has(p.key); });
  B.plan = null; B.approved = false;
  B.impMsg = 'Marqué solo a ' + found.size + ' ' + pl(found.size, 'persona', 'personas') + '.' + (miss.length ? ' No encontré en este Excel a: ' + miss.join(', ') + '.' : '');
  render();
}
async function bImportPrev(file){
  try{
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });

    if (!nm) throw new Error('Ese Excel no tiene la hoja “Faltan”. Usa el Excel que descargaste de la propuesta del briefing anterior.');
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, defval: '' });
    const names = rows.slice(1).map(r => String(r[0] || '').trim()).filter(n => n && nt(n) !== 'nadie falta');
    if (!names.length){ B.impMsg = 'En ese Excel no faltaba nadie.'; render(); return; }

  }catch(e){ B.impMsg = e && e.message ? e.message : 'No pude leer ese archivo.'; render(); }
}

/* ---------- tasks: aplicar acciones ---------- */
function describeOp(op){
  if (op.type === 'set' || op.type === 'put') return first(op.rec.name) + ' ahora lleva “' + op.task + '”.';
  if (op.type === 'swap') return first(op.a.name) + ' y ' + first(op.b.name) + ' intercambiaron tasks.';
  if (op.type === 'move') return 'Pasé “' + op.task + '” de ' + first(op.from.name) + ' a ' + first(op.to.name) + '.';
  if (op.type === 'add') return first(op.rec.name) + ' ahora también lleva “' + op.tokens.join(' | ') + '”.';
  if (op.type === 'movetok') return 'Pasé “' + op.tokens.join(' | ') + '” de ' + op.from.map(r => first(r.name)).join(' y ') + ' a ' + first(op.to.name) + '.';
  return 'Apliqué el reacomodo del macro.';
}
function applyOp(op){
  const mv = runOp(op); if (!mv.length) return;
  S.undo.push({ moves:mv }); render(); toastMsg(describeOp(op), true);
}
function runAutoTasks(days){
  const all = []; let left = 0;
  days.forEach(d => {
    const bad = () => taskIssues(d).filter(i => !i.soft);
    const tried = new Set();
    for (let n = 0; n < 40; n++){
      const before = bad().length;
      const list = bad().filter(i => i.cands.length && !tried.has(i.id));
      list.sort((a, b) => (b.group === 'Reacomodo') - (a.group === 'Reacomodo'));
      let done = false;
      for (const i of list){
        const mv = runOp(i.cands[0].op);
        if (!mv.length){ tried.add(i.id); continue; }
        if (bad().length < before){ mv.forEach(m => all.push(m)); done = true; break; }
        mv.slice().reverse().forEach(m => { m.rec[m.k] = m.from; }); tried.add(i.id);
      }
      if (!done) break;
    }
    left += bad().length;
  });
  if (all.length) S.undo.push({ moves:all });
  render();
  toastMsg(all.length ? 'Hice ' + all.length + ' ' + pl(all.length, 'cambio', 'cambios') + ' de tasks.' + (left ? ' Quedan ' + left + ' sin cubrir porque no hay gente que cumpla las reglas.' : ' Todos los tasks quedaron cubiertos.') : (left ? 'No encontré cambios que mejoren; quedan ' + left + ' sin cubrir.' : 'Los tasks ya estaban completos.'), all.length > 0);
}
function checklistHTML(d){
  const E = planDay(d), deps = [];
  E.forEach(e => { if (!deps.includes(e.dept)) deps.push(e.dept); });
  let h = '<details class="chk" open><summary>Tasks del día según el macro</summary><div class="chkGrid">';
  deps.forEach(dep => {
    h += '<section class="chkCard"><h3>' + esc(dep) + '</h3><ul>';
    E.filter(e => e.dept === dep && e.status !== 'rule').forEach(e => {
      const when = e.shift && e.shift !== 'día' ? e.shift : '';
      if (e.status === 'ok' || e.status === 'missing'){
        const nm2 = (e.holders || []).slice(0, 3).map(r => first(r.name)).join(', ');
        const who = e.status === 'ok' ? nm2 + (when ? ', ' + when : '') : 'falta ' + e.miss + (when ? ' (' + when + ')' : '');
        h += '<li class="ck ' + (e.status === 'ok' ? 'ok' : 'bad') + '"><span class="ckd"></span><span class="ckg">' + esc(e.group) + '</span><span class="ckw">' + esc(who) + '</span></li>';
      } else h += '<li class="ck ' + (e.soft || e.status === 'info' ? 'soft' : 'bad') + '"><span class="ckd"></span><span class="ckg">' + esc(e.text) + '</span></li>';
    });
    h += '</ul></section>';
  });
  return h + '</div></details>';
}

/* ---------- carga de archivo ---------- */
async function loadFile(file){

    S.buf = buf; S.name = file.name; S.days = out.days; S.warn = out.warnings; S.di = 0; S.sel = null; S.undo = []; S.ignored = new Set();
    $('#tools').hidden = false;

  }catch(e){
    const msg = e && e.message ? e.message : 'No pude leer el archivo.';
    if (err) err.textContent = msg; else toast(msg);

/* ---------- movimientos ---------- */
function setBreak(rec, k, t, opts){
  opts = opts || {};
  const from = rec[k];
  if (from === t) return;
  rec[k] = t;
  if (!opts.silent){
    S.undo.push({ moves:[{ rec, k, from }] });
    S.sel = { id:rec.id, k };
    render();
    toastMsg('Movido ' + first(rec.name) + ' ' + kLabel(k) + ': ' + fmt(from) + ' a ' + fmt(t) + '.', true);
  }
}
function undoLast(){
  const u = S.undo.pop(); if (!u) return;
  u.moves.slice().reverse().forEach(m => { m.rec[m.k] = m.from; });
  render(); toastMsg('Deshice el último cambio.', false);
}
function applySuggestion(d, issue){
  const m = suggestFor(d, issue);
  if (!m) return;
  m.r[m.k] = m.to;
  S.undo.push({ moves:[{ rec:m.r, k:m.k, from:m.from }] });
  S.sel = { id:m.r.id, k:m.k }; pendingFocus = m.r.id + ':' + m.k;
  render();
  toastMsg('Movido ' + first(m.r.name) + ' ' + kLabel(m.k) + ': ' + fmt(m.from) + ' a ' + fmt(m.to) + '.', true);
}
function runAuto(days){
  const all = []; let left = 0, blocked = 0;
  days.forEach(d => {
    const mv = autoFix(d);
    mv.forEach(m => all.push({ rec:m.r, k:m.k, from:m.from }));
    const rest = buildIssues(d, true).filter(i => i.type === 'queue' || i.type === 'task' || i.type === 'area');
    left += rest.length;
    rest.forEach(i => { if (i.items.some(x => x.r.end != null && x.r.start != null && x.r.end <= x.r.start)) blocked++; });
  });
  if (all.length) S.undo.push({ moves:all });
  render();
  let msg = all.length ? 'Hice ' + all.length + ' ' + pl(all.length, 'cambio', 'cambios') + '. Revísalos y deshaz los que no te gusten.' : 'No encontré movimientos que mejoren algo.';
  if (left) msg += ' Quedan ' + left + ' ' + pl(left, 'choque', 'choques') + (blocked ? '; depende de corregir turnos con salida mal escrita (avisos de datos).' : ' sin salida automática.');
  toastMsg(msg, all.length > 0);
}
function applyEndFix(rec, to){
  const from = rec.end; rec.end = to;
  S.undo.push({ moves:[{ rec, k:'end', from }] });
  render(); toastMsg('Salida de ' + first(rec.name) + ' ahora es ' + fmt(to) + '.', true);
}

/* ---------- toast ---------- */
function toastMsg(text, withUndo){
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(text) + '</span>' + (withUndo ? '<button type="button" data-act="undo">Deshacer</button>' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, withUndo ? 9000 : 5000);
}
const toast = m => toastMsg(m, false);
$('#toast').addEventListener('click', e => { if (e.target.closest('[data-act="undo"]')) { undoLast(); } });

/* ---------- render ---------- */
function render(){
  if (S.page === 'briefing'){ renderBriefing(); return; }
  $('#tools').hidden = !S.days.length;
  if (!S.days.length){ renderLanding(); return; }
  const scroller = document.querySelector('.boardScroll');
  const sl = scroller ? scroller.scrollLeft : 0, st = scroller ? scroller.scrollTop : 0;
  const cardsEl = document.querySelector('.cards'); const cst = cardsEl ? cardsEl.scrollTop : 0;
  document.documentElement.style.setProperty('--col', S.col + 'px');
  const d = day();
  const all = S.days.map(buildIssues);
  const issues = all[S.di];
  app.innerHTML = '<div class="ws">' + tabsHTML(all) + sumHTML(d, issues) +
    '<div class="grid"><section class="panel" aria-label="Tablero del día">' + inspectorHTML() + boardHTML(d, issues) + checklistHTML(d) + '</section>' + sideHTML(d, issues) + '</div></div>' + exportHTML();
  const sc = document.querySelector('.boardScroll');
  if (sc){ sc.scrollLeft = sl; sc.scrollTop = st; }
  const ce = document.querySelector('.cards'); if (ce) ce.scrollTop = cst;
  if (pendingFocus){
    const el = document.querySelector('[data-chip="' + pendingFocus + '"]');
    if (el){ el.scrollIntoView({ block:'nearest', inline:'center' }); el.classList.add('pulse'); }
    pendingFocus = null;
  }
}

function tabsHTML(all){
  return '<div class="tabs" role="tablist" aria-label="Días">' + S.days.map((d, i) => {
    const is = all[i].filter(x => isActive(x) && !S.ignored.has(x.id));
    const soft = all[i].filter(x => !isActive(x) && !S.ignored.has(x.id)).length;
    const cls = is.length ? 'bad' : (soft ? 'warn' : '');
    const lab = is.length ? is.length + ' ' + pl(is.length, 'alerta', 'alertas') : (soft ? soft + ' ' + pl(soft, 'aviso', 'avisos') : 'Todo bien');
    return '<button role="tab" class="tab" data-act="tab" data-i="' + i + '" aria-selected="' + (i === S.di) + '"><b>' + esc(SHORT[d.label] || d.label) + ' ' + esc(d.dom) + '</b><small><span class="dot ' + cls + '"></span>' + lab + '</small></button>';
  }).join('') + '</div>';
}

function sumHTML(d, issues){
  const act = issues.filter(i => !S.ignored.has(i.id));
  const nq = act.filter(i => i.type === 'queue' || i.type === 'area').length, nt = act.filter(i => i.type === 'task').length;
  const nc = act.filter(i => i.type === 'cover' && (i.kind === 'thin' || i.kind === 'empty')).length;
  const na = act.filter(i => i.type === 'assign' && !i.soft).length;
  const nm = act.length - nq - nt - nc - na;
  let s;
  if (nq + nt + nc === 0) s = d.label + ' ' + d.dom + ': sin choques ni huecos de cobertura.';
  else s = d.label + ' ' + d.dom + ': ' + nq + ' ' + pl(nq, 'choque', 'choques') + ' de break, ' + nt + ' de task y ' + nc + ' ' + pl(nc, 'hueco', 'huecos') + ' de cobertura.';
  if (na) s += ' Faltan ' + na + ' ' + pl(na, 'asignación', 'asignaciones') + ' de tasks.';
  if (nm) s += ' Además ' + nm + ' ' + pl(nm, 'aviso menor', 'avisos menores') + '.';
  const anyChange = d.recs.some(r => isChanged(r, 'b1') || isChanged(r, 'b2') || r.end !== r.oe || r.task !== r.ot || r.queue !== r.oq);
  return '<div class="sumbar"><p>' + esc(s) + '</p>' +
    '<button class="btn" data-act="auto-day">Arreglar este día</button>' +
    '<button class="btn" data-act="auto-week">Arreglar la semana</button>' +
    '<button class="btn" data-act="auto-tasks">Completar tasks del día</button>' +
    '<button class="btn" data-act="auto-tasks-week">Completar tasks de la semana</button>' +
    '<button class="btn ghost" data-act="reset-day"' + (anyChange ? '' : ' disabled') + '>Restablecer día</button>' + (S.dl === null ? '' : '<button class="btn primary" data-act="dl-xlsx"' + (changeList().length ? '' : ' disabled') + '>Descargar Excel corregido</button>') + '</div>';
}

function inspectorHTML(){
  const z = '<div class="zoom"><button class="btn small" data-act="zoom-out" aria-label="Alejar">−</button><span class="muted">Zoom</span><button class="btn small" data-act="zoom-in" aria-label="Acercar">+</button></div>';
  if (!S.sel) return '<div class="inspector"><span class="muted">Arrastra un break para moverlo, o haz clic en uno para ajustarlo con precisión. Las barras tenues son los turnos.</span>' + z + '</div>';
  const r = findRec(S.sel.id);
  if (!r) return '<div class="inspector"><span class="muted">Selecciona un break.</span>' + z + '</div>';
  const k = S.sel.k, orig = k === 'b1' ? r.o1 : r.o2;
  return '<div class="inspector"><span class="who2">' + esc(r.name) + '</span><span class="muted">' + (k === 'b1' ? 'Break 1' : 'Break 2') + ', ' + esc(r.queue) + ', turno ' + fmt(r.start) + ' a ' + fmt(r.end) + '</span>' +
    '<button class="btn small" data-act="nudge" data-d="-30" aria-label="30 minutos antes">−30</button>' +
    '<input type="time" step="1800" value="' + fmt24(r[k]) + '" data-act="settime" aria-label="Hora del break">' +
    '<button class="btn small" data-act="nudge" data-d="30" aria-label="30 minutos después">+30</button>' +
    (isChanged(r, k) ? '<button class="btn small" data-act="revert">Volver a ' + fmt(orig) + '</button>' : '') +
    '<button class="btn small ghost" data-act="deselect">Soltar</button>' + z + '</div>';
}

function boardHTML(d, issues){
  const flagged = new Set();
  issues.filter(i => (i.type === 'queue' || i.type === 'task' || i.type === 'area') && !S.ignored.has(i.id)).forEach(i => i.items.forEach(x => flagged.add(x.r.id + ':' + x.k)));
  const byLane = {}; d.recs.forEach(r => { (byLane[laneOf(r)] = byLane[laneOf(r)] || []).push(r); });
  const order = LANES.concat(['Otros']).filter(l => byLane[l]);
  const px = m => ((m - S0) / STEP) * S.col;
  let h = '<div class="boardScroll"><div class="boardInner"><div class="axis"><div class="who">Persona</div><div class="ticks">';
  for (let m = S0; m < S1; m += 60) h += '<div class="tick" style="left:' + px(m) + 'px">' + fmt(m).replace(':00', '') + '</div>';
  h += '</div></div>';
  // cobertura
  const covQ = ['Phones', 'Chats'].filter(q => byLane[q]);
  if (covQ.length){
    const covs = covQ.map(q => coverage(d.recs, q));
    const maxOn = Math.max(1, ...covs.map(c => Math.max(...c.map(x => x.on))));
    const unit = Math.max(5, Math.floor(50 / maxOn));
    h += '<section class="lane" style="--q:var(--ink)"><div class="laneHead"><i></i>Cobertura<small>personas trabajando por media hora (lo tenue es quien está en turno)</small></div>';
    covQ.forEach((q, qi) => {
      h += '<div class="covRow" style="--q:' + QCOL[q] + '"><div class="who"><b>' + q + '</b><small>overflow disponible en el tooltip</small></div><div class="covTrack">';
      covs[qi].forEach(c => {
        if (!c.on) return;
        const low = c.on >= 2 && c.work <= CFG.minCover;
        h += '<div class="bar' + (low ? ' low' : '') + '" style="left:' + px(c.s) + 'px;height:' + (c.on * unit + 4) + 'px" title="' + esc(q + ' ' + fmt(c.s) + ': ' + c.work + ' de ' + c.on + ' trabajando. Overflow: ' + overflowAt(d.recs, c.s) + (c.onBreak.length ? '. En break: ' + c.onBreak.join(', ') : '')) + '"><i style="height:' + Math.max(3, c.work * unit) + 'px">' + (c.work * unit >= 12 ? c.work : '') + '</i></div>';
      });
      h += '</div></div>';
    });
    h += '</section>';
  }
  order.forEach(l => {
    const rows = byLane[l].slice().sort((a, b) => (a.start - b.start) || a.name.localeCompare(b.name));
    const collapsible = (l === 'Overflow' || l === 'Otros');
    const isOpen = !collapsible || S.open[l];
    const qIssues = issues.filter(i => ((i.type === 'queue' && i.key === l) || (i.type === 'area' && i.items.some(x => laneOf(x.r) === l))) && !S.ignored.has(i.id));
    h += '<section class="lane" style="--q:' + QCOL[l] + '"><div class="laneHead"><i></i>' + l + '<small>' + rows.length + ' ' + pl(rows.length, 'persona', 'personas') + '</small>' +
      (qIssues.length ? '<span class="flag">' + qIssues.length + ' ' + pl(qIssues.length, 'choque', 'choques') + '</span>' : '') +
      (collapsible ? '<button data-act="toggle-lane" data-l="' + l + '">' + (isOpen ? 'Ocultar' : 'Mostrar') + '</button>' : '') + '</div>';
    if (isOpen){
      // franjas de choque
      qIssues.forEach(i => {
        const t0 = i.items[0].t, t1 = i.items[i.items.length - 1].t + CFG.dur;
        h += '<div class="seam" style="left:calc(var(--who) + ' + px(t0) + 'px);width:' + (px(t1) - px(t0)) + 'px"></div>';
      });
      rows.forEach(r => {
        const valid = r.start != null && r.end != null && r.end > r.start;
        h += '<div class="rowL"><div class="who" title="' + esc(r.name + ', ' + r.area) + '"><b>' + esc(r.name) + '</b><small>' + esc(r.area) + (r.task && r.task.trim() ? ', ' + esc(r.task.split('|')[0].trim()) : '') + '</small></div><div class="track">';
        if (r.start != null){
          h += valid ? '<div class="shift" style="left:' + px(r.start) + 'px;width:' + (px(r.end) - px(r.start)) + 'px"></div>' : '<div class="shift invalid" style="left:' + px(r.start) + 'px">¿salida?</div>';
        }
        ['b1', 'b2'].forEach(k => {
          if (r[k] == null) return;
          const sel = S.sel && S.sel.id === r.id && S.sel.k === k;
          const cls = 'chip' + (flagged.has(r.id + ':' + k) ? ' bad' : '') + (sel ? ' sel' : '') + (isChanged(r, k) ? ' changed' : '');
          h += '<div class="' + cls + '" role="button" tabindex="0" data-chip="' + r.id + ':' + k + '" data-rid="' + r.id + '" data-k="' + k + '" style="left:' + (px(r[k]) + 1) + 'px;width:' + (CFG.dur / STEP * S.col - 3) + 'px" aria-label="' + esc(r.name + ', ' + (k === 'b1' ? 'Break 1' : 'Break 2') + ', ' + fmt(r[k])) + '" title="' + esc(r.name + ' ' + kLabel(k) + (isChanged(r, k) ? ' (antes ' + fmt(k === 'b1' ? r.o1 : r.o2) + ')' : '')) + '"><span class="t">' + fmtShort(r[k]) + '</span></div>';
        });
        h += '</div></div>';
      });
    }
    h += '</section>';
  });
  return h + '</div></div>';
}

function cardInfo(d, i){
  const recs = d.recs;
  if (i.type === 'assign'){
    const where = i.shift && i.shift !== 'día' ? ' de la ' + i.shift : '';
    const names = i.cands.slice(0, 3).filter(c => c.rec).map(c => c.rec.name + ' (' + c.why + ')');
    if (i.kind === 'missing') return { cls:'task', title: i.dept + where + ': falta ' + i.group + '.', text: (i.ctx ? 'Es parte de “' + i.ctx + '”. ' : '') + (names.length ? 'Lo puede llevar: ' + names.join('; ') + '.' : 'No hay nadie en turno que cumpla las reglas del macro para llevarlo.') + (i.note ? ' ' + i.note : '') };
    if (i.kind === 'rule' && i.group === 'Reacomodo') return { cls:'task', title: i.dept + where + ': reacomodo sugerido por el macro', text: i.text };
    if (i.kind === 'rule') return { cls: i.soft ? 'data' : 'task', title: i.dept + where + ': ' + i.text, text: i.cands.length ? 'Elige una opción para resolverlo.' : 'No encontré un cambio que lo resuelva sin crear otro problema.' };
    return { cls: i.soft ? 'data' : 'task', title: i.text, text: i.soft ? 'Es un aviso; puede ser normal (por ejemplo, un día libre).' : 'Sin esto, ese task queda sin cubrir.' };
  }
  if (i.type === 'queue'){
    const names = i.items.map(x => x.r.name + ' (' + kLabel(x.k) + ')');
    return { cls:'queue', title: i.key + ' a las ' + fmt(i.time) + ': salen juntos ' + joinNames(names) + '.', text: i.items.length > 2 ? 'Tres o más de la misma cola en break a la vez dejan poca gente atendiendo.' : 'Dos de la misma cola no deberían estar en break al mismo tiempo.' };
  }
  if (i.type === 'area'){
    const names = i.items.map(x => x.r.name + ' (' + kLabel(x.k) + ')');
    return { cls:'queue', title: i.key + ' a las ' + fmt(i.time) + ': salen juntos ' + joinNames(names) + '.', text:'Las personas de ' + i.key + ' no deben estar en break al mismo tiempo.' };
  }
  if (i.type === 'task'){
    const m = i.items.filter(x => x.role === 'main'), s = i.items.filter(x => x.role === '2nd');
    return { cls:'task', title: i.key + ' a las ' + fmt(i.time) + ': ' + joinNames(m.map(x => x.r.name)) + ' (principal) y ' + joinNames(s.map(x => x.r.name)) + ' (2nd) salen juntos.', text:'Mientras uno está en break, el otro debe estar cubriendo esa task.' };
  }
  if (i.type === 'cover'){
    const range = fmt(i.from) + ' a ' + fmt(i.to), ov2 = overflowAt(recs, i.from);
    if (i.kind === 'thin') return { cls:'cover bad', title: i.key + ' de ' + range + ': queda ' + (i.minWork) + ' de ' + i.on + ' trabajando.', text:'En break: ' + joinNames(i.names) + '. Overflow disponible: ' + ov2 + '.' };
    if (i.kind === 'empty') return { cls:'cover bad', title: i.key + ' de ' + range + ': no hay nadie en turno.', text:'Overflow disponible: ' + ov2 + '.' };
    return { cls:'cover warn', title: i.key + ' de ' + range + ': solo hay 1 persona en turno.', text:'No es un choque, pero no hay relevo en esa cola. Overflow disponible: ' + ov2 + '.' };
  }
  return { cls:'data', title:i.text, text:i.hint };
}

function sideHTML(d, issues){
  const F = [['all', 'Todo'], ['queue', 'Breaks'], ['task', 'Tasks'], ['assign', 'Asignación'], ['cover', 'Cobertura'], ['data', 'Datos']];
  const vis = issues.filter(i => S.showIgnored || !S.ignored.has(i.id));
  const ft = i => i.type === 'area' ? 'queue' : i.type;
  const cnt = k => vis.filter(i => k === 'all' || ft(i) === k).length;
  let list = vis.filter(i => S.filter === 'all' || ft(i) === S.filter);
  const sev = i => (i.type === 'queue' || i.type === 'task' || i.type === 'area') ? 0 : (i.type === 'assign' && !i.soft) ? 1 : (i.type === 'cover' && i.kind !== 'solo') ? 1 : i.type === 'cover' ? 2 : 3;
  list.sort((a, b) => sev(a) - sev(b) || a.time - b.time);
  const nIgn = issues.filter(i => S.ignored.has(i.id)).length;
  let cards = '';
  list.forEach(i => {
    const c = cardInfo(d, i), ign = S.ignored.has(i.id);
    let apply = '';
    if (!ign && (i.type === 'queue' || i.type === 'task' || i.type === 'area' || (i.type === 'cover' && i.kind === 'thin') || (i.type === 'data' && i.key === 'horario'))){
      const m = suggestFor(d, i);
      if (m) apply = '<button class="btn small apply" data-act="apply" data-id="' + esc(i.id) + '">Mover ' + esc(first(m.r.name)) + ' ' + kLabel(m.k) + ' a ' + fmt(m.to) + '</button>';
    }
    if (i.type === 'data' && i.fix) apply = '<button class="btn small apply" data-act="fixend" data-rid="' + i.fix.rec.id + '" data-to="' + i.fix.to + '">Poner salida ' + fmt(i.fix.to) + '</button>';
    if (!ign && i.type === 'assign' && i.cands.length){
      apply = i.cands.slice(0, 3).map((c, ci) => '<button class="btn small' + (ci === 0 ? ' apply' : '') + '" data-act="assign-op" data-id="' + esc(i.id) + '" data-ci="' + ci + '">' + esc(c.label || ((c.op.type === 'swap' ? 'Intercambiar con ' : (c.op.type === 'move' || c.op.type === 'movetok') ? 'Pasarlo a ' : 'Asignar a ') + first(c.rec.name))) + '</button>').join('');
    }
    const target = (i.items && i.items[0]) ? i.items[0].r.id + ':' + i.items[0].k : (i.rec ? i.rec.id : '');
    cards += '<article class="card ' + c.cls + '" data-cid="' + esc(i.id) + '"><div class="rail"></div><div class="bd"><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p><div class="acts">' +
      (i.type === 'assign' ? '' : '<button class="btn small" data-act="view" data-id="' + esc(i.id) + '">Ver en el tablero</button>') + apply +
      '<button class="btn small ghost" data-act="' + (ign ? 'unignore' : 'ignore') + '" data-id="' + esc(i.id) + '">' + (ign ? 'Volver a avisar' : 'Ignorar') + '</button></div></div></article>';
  });
  if (!cards) cards = '<div class="empty"><b>Todo despejado</b>No hay alertas en esta categoría para ' + esc(d.label) + '.</div>';
  let nfix = 0; S.days.forEach(x => x.recs.forEach(r => { if (r.start != null && r.end != null && r.end <= r.start) nfix++; }));
  const fixAll = nfix ? '<div class="tiny"><button class="btn small" data-act="fixend-all">Poner salida a 8 h después de la entrada a ' + nfix + ' ' + pl(nfix, 'turno mal escrito', 'turnos mal escritos') + ' de la semana</button></div>' : '';
  const warn = (S.warn || []).map(w => '<div class="tiny">' + esc(w) + '</div>').join('');
  return '<aside class="panel side" aria-label="Alertas"><div class="sideHead"><h2>Alertas de ' + esc(d.label) + '</h2><div class="chips">' +
    F.map(f => '<button class="fchip" data-act="filter" data-f="' + f[0] + '" aria-pressed="' + (S.filter === f[0]) + '">' + f[1] + ' ' + cnt(f[0]) + '</button>').join('') + '</div></div>' +
    '<div class="cards">' + cards + '</div>' + fixAll +
    (nIgn ? '<div class="tiny"><button class="btn small ghost" data-act="toggle-ignored">' + (S.showIgnored ? 'Ocultar' : 'Mostrar') + ' ' + nIgn + ' ' + pl(nIgn, 'ignorada', 'ignoradas') + '</button></div>' : '') + warn + '</aside>';
}

function changeList(){
  const rows = [];
  S.days.forEach(d => d.recs.forEach(r => {
    if (isChanged(r, 'b1')) rows.push({ d, r, what:'Break 1', from:r.o1, to:r.b1, cell:r.a1, k:'b1' });
    if (isChanged(r, 'b2')) rows.push({ d, r, what:'Break 2', from:r.o2, to:r.b2, cell:r.a2, k:'b2' });
    if (r.end !== r.oe) rows.push({ d, r, what:'Salida', from:r.oe, to:r.end, cell:r.ae, k:'end' });
    if (r.task !== r.ot) rows.push({ d, r, what:'Task', from:r.ot, to:r.task, cell:r.at, k:'task', fs:r.ot || '(vacío)', ts:r.task || '(vacío)' });
    if (r.queue !== r.oq) rows.push({ d, r, what:'Cola', from:r.oq, to:r.queue, cell:r.aq, k:'queue', fs:r.oq || '(vacío)', ts:r.queue || '(vacío)' });
  }));
  rows.forEach(c => { if (c.fs === undefined){ c.fs = fmt(c.from); c.ts = fmt(c.to); } });
  return rows;
}

function exportHTML(){
  const ch = changeList(), n = ch.length;
  const per = S.days.map(d => [d.label, ch.filter(c => c.d === d).length]).filter(x => x[1]);
  const msg = n ? '<b>' + n + ' ' + pl(n, 'cambio', 'cambios') + '</b> ' + esc(per.map(p => p[0] + ' ' + p[1]).join(', ')) : 'Sin cambios todavía. Lo que muevas aquí no toca tu archivo hasta que lo descargues.';
  return '<div class="exportBar"><div class="msg">' + msg + '</div>' +
    '<button class="btn" data-act="undo"' + (S.undo.length ? '' : ' disabled') + '>Deshacer</button>' +
    '<button class="btn" data-act="show-changes"' + (n ? '' : ' disabled') + '>Ver cambios</button>' +
    (S.dl === null ? '<span style="font-size:13px;color:var(--bad)">Este visor no permite descargar archivos; abre la página en claude.ai para bajar el Excel.</span>' : '<button class="btn" data-act="dl-csv"' + (n ? '' : ' disabled') + '>Lista de cambios (.csv)</button><button class="btn primary" data-act="dl-xlsx"' + (n ? '' : ' disabled') + '>Descargar Excel corregido</button>') + '</div>';
}

/* ---------- portada ---------- */
function renderLanding(){
  $('#tools').hidden = true;
  app.innerHTML = '<div class="landing"><div><h2>Sube la semana y separa los breaks que se pisan.</h2>' +
    '<p class="lead">Lee tu Excel de Tasks (una hoja por día), marca los choques de break y de task, los huecos de cobertura y los tasks que faltan por asignar, y te deja arreglarlos. Al final descargas el mismo Excel con las horas corregidas.</p>' +
    '<div class="drop" id="drop"><div><strong>Arrastra aquí el archivo .xlsx</strong><span>Hojas tipo “Monday 16”, “Tuesday 17”…</span></div><button class="btn primary" id="pick" type="button">Elegir archivo</button></div>' +
    '<div class="err" id="err" role="alert"></div><p class="privacy">El archivo se lee en tu navegador; no se envía a ningún servidor.</p></div>' +
    '<div class="demo" aria-label="Ejemplo"><h3>Así se ve un choque y su arreglo</h3><div class="demoLane clash" id="dl"><div class="dSeam"></div>' +
    '<div class="dRow r1"><div class="dChip" style="left:50%">6:30pm</div></div><div class="dRow r2"><div class="dChip" id="dc2" style="left:50%">6:30pm</div></div></div>' +
    '<div class="dTimes"><span>5:30 pm</span><span>6:00 pm</span><span>6:30 pm</span><span>7:00 pm</span></div>' +
    '<p id="dmsg">Dos de Phones salen a las 6:30 pm. Con el Excel cargado, cada choque trae una sugerencia como esta.</p><button class="btn apply" id="dbtn" type="button">Mover a las 6:00 pm</button></div></div>';
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  $('#pick').addEventListener('click', () => $('#file').click());
  let solved = false;
  $('#dbtn').addEventListener('click', () => {
    solved = !solved;
    $('#dl').classList.toggle('clash', !solved);
    $('#dc2').style.left = solved ? '25%' : '50%';
    $('#dc2').textContent = solved ? '6:00pm' : '6:30pm';
    $('#dbtn').textContent = solved ? 'Volver a ponerlo igual' : 'Mover a las 6:00 pm';
    $('#dmsg').textContent = solved ? 'Sin choque: uno sale a las 6:00 pm y el otro a las 6:30 pm.' : 'Dos de Phones salen a las 6:30 pm. Con el Excel cargado, cada choque trae una sugerencia como esta.';
  });
}

/* ---------- descargas ---------- */
function stamp(n){ return n.replace(/\.xlsx$/i, ''); }
async function dlXlsx(){
  if (!S.dl) return;
  const edits = collectEdits(S.days);
  if (!edits.length) return;
  try{
    const out = await patchXlsx(S.buf, edits);
    await S.dl.save({ filename: stamp(S.name) + ' corregido.xlsx', data: out.data });
    toast('Excel corregido listo con ' + edits.length + ' ' + pl(edits.length, 'celda cambiada', 'celdas cambiadas') + '.');
  }catch(e){
    if (e && e.code === 'declined') return;
    toast(e && e.message ? e.message : 'No pude generar el Excel.');
  }
}
async function dlCsv(){
  if (!S.dl) return;
  const rows = [['Día', 'Persona', 'Área', 'Cola', 'Qué', 'Antes', 'Ahora', 'Celda']];
  changeList().forEach(c => rows.push([c.d.sheetName, c.r.name, c.r.area, c.r.queue, c.what, c.fs, c.ts, c.cell]));
  const csv = '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  try{ await S.dl.save({ filename: stamp(S.name) + ' cambios.csv', data: csv }); }
  catch(e){ if (!(e && e.code === 'declined')) toast('No pude generar la lista.'); }
}
function showChanges(){
  const ch = changeList();
  $('#dlgBody').innerHTML = '<table><thead><tr><th>Día</th><th>Persona</th><th>Qué</th><th>Antes</th><th></th><th>Ahora</th><th>Celda</th><th></th></tr></thead><tbody>' +
    ch.map((c, i) => '<tr><td>' + esc(c.d.label) + '</td><td>' + esc(c.r.name) + '</td><td>' + c.what + '</td><td>' + esc(c.fs) + '</td><td class="arrow">a</td><td><b>' + esc(c.ts) + '</b></td><td>' + c.cell + '</td><td><button class="btn small" data-act="revert-row" data-i="' + i + '">Deshacer</button></td></tr>').join('') + '</tbody></table>';
  $('#dlg').showModal();
}

/* ---------- eventos ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, d = S.days.length ? day() : null;
  if (a === 'tab'){ S.di = +t.dataset.i; S.sel = null; render(); }
  else if (a === 'filter'){ S.filter = t.dataset.f; render(); }
  else if (a === 'toggle-lane'){ S.open[t.dataset.l] = !S.open[t.dataset.l]; render(); }
  else if (a === 'toggle-ignored'){ S.showIgnored = !S.showIgnored; render(); }
  else if (a === 'ignore'){ S.ignored.add(t.dataset.id); render(); }
  else if (a === 'unignore'){ S.ignored.delete(t.dataset.id); render(); }
  else if (a === 'zoom-in'){ S.col = Math.min(88, S.col + 8); render(); }
  else if (a === 'zoom-out'){ S.col = Math.max(56, S.col - 8); render(); }
  else if (a === 'deselect'){ S.sel = null; render(); }
  else if (a === 'undo'){ undoLast(); }
  else if (a === 'auto-day'){ runAuto([d]); }
  else if (a === 'auto-week'){ runAuto(S.days); }
  else if (a === 'reset-day'){
    const mv = []; d.recs.forEach(r => { ['b1', 'b2'].forEach(k => { const o = k === 'b1' ? r.o1 : r.o2; if (r[k] !== o){ mv.push({ rec:r, k, from:r[k] }); r[k] = o; } }); if (r.end !== r.oe){ mv.push({ rec:r, k:'end', from:r.end }); r.end = r.oe; } [['task', r.ot], ['queue', r.oq]].forEach(([k, o]) => { if (r[k] !== o){ mv.push({ rec:r, k, from:r[k] }); r[k] = o; } }); });
    if (mv.length) S.undo.push({ moves:mv });
    S.sel = null; render(); toastMsg('Dejé ' + d.label + ' como venía en el archivo.', mv.length > 0);
  }
  else if (a === 'apply'){ const i = buildIssues(d).find(x => x.id === t.dataset.id); if (i) applySuggestion(d, i); }
  else if (a === 'fixend-all'){
    const mv = []; S.days.forEach(x => x.recs.forEach(r => { if (r.start != null && r.end != null && r.end <= r.start){ mv.push({ rec:r, k:'end', from:r.end }); r.end = r.start + 480; } }));
    if (mv.length){ S.undo.push({ moves:mv }); render(); toastMsg('Corregí ' + mv.length + ' ' + pl(mv.length, 'salida', 'salidas') + ' a 8 h después de la entrada. Ahora el arreglo automático puede mover sus breaks.', true); }
  }
  else if (a === 'assign-op'){ const i = buildIssues(d).find(x => x.id === t.dataset.id); const c = i && i.cands[+t.dataset.ci]; if (c) applyOp(c.op); }
  else if (a === 'auto-tasks'){ runAutoTasks([d]); }
  else if (a === 'auto-tasks-week'){ runAutoTasks(S.days); }
  else if (a === 'fixend'){ applyEndFix(findRec(t.dataset.rid), +t.dataset.to); }
  else if (a === 'view'){
    const i = buildIssues(d).find(x => x.id === t.dataset.id); if (!i) return;
    if (i.items && i.items[0]){ const r = i.items[0].r; if (!LANES.includes(r.queue) || r.queue === 'Overflow') S.open[laneOf(r)] = true; S.sel = { id:r.id, k:i.items[0].k }; pendingFocus = r.id + ':' + i.items[0].k; }
    else if (i.rec){ S.open[laneOf(i.rec)] = true; S.sel = null; pendingFocus = null; }
    render();
    if (i.type === 'cover'){ const sc = document.querySelector('.boardScroll'); if (sc) sc.scrollTo({ left: Math.max(0, ((i.from - S0) / STEP) * S.col - 120), behavior:'smooth' }); }
    if (i.rec){ const sc = document.querySelector('.boardScroll'); if (sc) sc.scrollTo({ left: Math.max(0, ((i.rec.start - S0) / STEP) * S.col - 120), behavior:'smooth' }); }
  }
  else if (a === 'nudge'){
    const r = findRec(S.sel.id); setBreak(r, S.sel.k, r[S.sel.k] + +t.dataset.d);
  }
  else if (a === 'revert'){ const r = findRec(S.sel.id); setBreak(r, S.sel.k, S.sel.k === 'b1' ? r.o1 : r.o2); }
  else if (a === 'show-changes'){ showChanges(); }
  else if (a === 'dl-xlsx'){ dlXlsx(); }
  else if (a === 'dl-csv'){ dlCsv(); }
});
app.addEventListener('change', e => {
  const t = e.target.closest('[data-act="settime"]'); if (!t || !S.sel || !t.value) return;
  const [h, m] = t.value.split(':').map(Number); const r = findRec(S.sel.id);
  setBreak(r, S.sel.k, h * 60 + m);
});
$('#dlgBody').addEventListener('click', e => {
  const t = e.target.closest('[data-act="revert-row"]'); if (!t) return;
  const c = changeList()[+t.dataset.i]; if (!c) return;
  if (c.k === 'end') c.r.end = c.r.oe; else c.r[c.k] = c.from;
  render(); const ch = changeList();
  if (ch.length) showChanges(); else $('#dlg').close();
});
$('#dlgClose').addEventListener('click', () => $('#dlg').close());

/* arrastrar */
app.addEventListener('pointerdown', e => {
  const chip = e.target.closest('.chip'); if (!chip || e.button > 0) return;
  const rec = findRec(chip.dataset.rid);
  drag = { chip, rec, k:chip.dataset.k, x0:e.clientX, steps:0 };
  chip.setPointerCapture(e.pointerId); chip.classList.add('drag');
});
app.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.steps = Math.round((e.clientX - drag.x0) / S.col);
  drag.chip.style.transform = 'translateX(' + (drag.steps * S.col) + 'px)';
  drag.chip.querySelector('.t').textContent = fmtShort(drag.rec[drag.k] + drag.steps * STEP);
});
function endDrag(e){
  if (!drag) return;
  const { rec, k, steps, chip } = drag; drag = null;
  chip.classList.remove('drag'); chip.style.transform = '';
  if (!steps){ S.sel = { id:rec.id, k }; render(); return; }
  let nt = rec[k] + steps * STEP;
  if (rec.start != null && rec.end > rec.start) nt = Math.max(rec.start, Math.min(rec.end - CFG.dur, nt));
  if (nt === rec[k]){ render(); return; }
  pendingFocus = rec.id + ':' + k;
  setBreak(rec, k, nt);
}
app.addEventListener('pointerup', endDrag);
app.addEventListener('pointercancel', e => { if (drag){ drag.chip.classList.remove('drag'); drag.chip.style.transform = ''; drag = null; render(); } });
app.addEventListener('keydown', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  const rec = findRec(chip.dataset.rid), k = chip.dataset.k;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault(); pendingFocus = rec.id + ':' + k;
    setBreak(rec, k, rec[k] + (e.key === 'ArrowLeft' ? -STEP : STEP));
    const el = document.querySelector('[data-chip="' + rec.id + ':' + k + '"]'); if (el) el.focus();
  } else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); S.sel = { id:rec.id, k }; render(); const el = document.querySelector('[data-chip="' + rec.id + ':' + k + '"]'); if (el) el.focus(); }
});

/* controles superiores */
$('#dur').addEventListener('change', e => { CFG.dur = +e.target.value; render(); });
$('#minc').addEventListener('change', e => { CFG.minCover = +e.target.value; render(); });
$('#newFile').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return; if (S.page === 'briefing'){ if (B.step === 4) bLoad(f); return; } loadFile(f); });

/* descargas disponibles */
(async () => {
  const localDl = () => ({ save: async ({ filename, data }) => { const u = URL.createObjectURL(new Blob([data], { type:'application/octet-stream' })); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return { status:'saved' }; } });
  try{ S.dl = (window.claude && claude.use) ? await claude.use('downloads') : localDl(); }catch(_){ S.dl = window.claude ? null : localDl(); }
  if (S.days.length || S.page === 'briefing') render();
})();
function route(){
  S.page = location.hash === '#briefing' ? 'briefing' : 'breaks';
  document.body.classList.toggle('page-briefing', S.page === 'briefing');
  document.querySelectorAll('#nav [data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === S.page ? 'page' : 'false'));
  render();
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (b) location.hash = b.dataset.nav; });
window.addEventListener('hashchange', route);
route();
})();
</script>
