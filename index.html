<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisor de breaks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#EAEEF4; --panel:#FFFFFF; --panel2:#F4F6FA; --ink:#101B33; --muted:#566280; --line:#D4DAE6; --grid:#E3E8F0;
  --phones:#2F5BEA; --chats:#0A7F64; --tickets:#A36405; --casino:#A82B7C; --other:#5F6A8A; --chipInk:#FFFFFF;
  --bad:#D3263A; --badSoft:#FBE7EA; --warn:#B87408; --warnSoft:#FBF0DA; --ok:#1B7F4F; --okSoft:#DDF3E7; --info:#3F5BA9; --infoSoft:#E3E9F8;
  --shadow:0 1px 2px rgba(16,27,51,.08), 0 8px 24px -12px rgba(16,27,51,.22);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --col:64px; --who:176px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1222; --panel:#131C32; --panel2:#18233D; --ink:#E7ECF8; --muted:#97A4C2; --line:#27334F; --grid:#1D2943;
    --phones:#6C8CFF; --chats:#2FC3A0; --tickets:#E8A93A; --casino:#E26BB5; --other:#8D99BA; --chipInk:#0B1222;
    --bad:#FF5B6E; --badSoft:#3A1B26; --warn:#E8A93A; --warnSoft:#3A2E15; --ok:#4ED08C; --okSoft:#143426; --info:#8FA8F0; --infoSoft:#1C2748;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1222; --panel:#131C32; --panel2:#18233D; --ink:#E7ECF8; --muted:#97A4C2; --line:#27334F; --grid:#1D2943;
  --phones:#6C8CFF; --chats:#2FC3A0; --tickets:#E8A93A; --casino:#E26BB5; --other:#8D99BA; --chipInk:#0B1222;
  --bad:#FF5B6E; --badSoft:#3A1B26; --warn:#E8A93A; --warnSoft:#3A2E15; --ok:#4ED08C; --okSoft:#143426; --info:#8FA8F0; --infoSoft:#1C2748;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--phones);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barra superior */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px clamp(14px,3vw,32px)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:21px;font-weight:800}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.tools label{display:flex;gap:6px;align-items:center}
.tools select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px;transition:transform .12s, background .12s}
.btn:hover{background:var(--panel2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink);opacity:.9}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.small{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.apply{background:var(--okSoft);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}

/* portada */
.landing{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;max-width:1180px;margin:0 auto;padding:clamp(16px,5vw,64px) clamp(14px,3vw,32px)}
.landing h2{font-size:clamp(32px,5.2vw,56px);line-height:1.02;font-weight:800;max-width:14ch}
.landing p.lead{color:var(--muted);font-size:17px;max-width:46ch;margin:16px 0 26px}
.drop{border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:20px;padding:26px;background:var(--panel);display:flex;gap:16px;align-items:center;flex-wrap:wrap;transition:border-color .15s, background .15s}
.drop.over{border-color:var(--phones);background:color-mix(in srgb,var(--phones) 8%,var(--panel))}
.drop strong{font-family:var(--display);font-size:19px;display:block}
.drop span{color:var(--muted);font-size:14px}
.err{margin-top:12px;color:var(--bad);font-weight:600;min-height:1.4em}
.privacy{font-size:13px;color:var(--muted);margin-top:10px}
.demo{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:20px 20px 16px;border:1px solid var(--line)}
.demo h3{font-size:16px;margin-bottom:12px}
.demoLane{position:relative;height:104px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--grid) calc(25% - 1px) 25%);border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
.dRow{position:absolute;left:0;right:0;height:38px}
.dRow.r1{top:8px}.dRow.r2{top:56px}
.dChip{position:absolute;top:5px;height:28px;width:19%;border-radius:8px;background:var(--phones);color:var(--chipInk);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;transition:left .5s cubic-bezier(.3,.8,.3,1), background .3s}
.demoLane.clash .dChip{background:repeating-linear-gradient(45deg,var(--bad) 0 6px,color-mix(in srgb,var(--bad) 70%,#000) 6px 12px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.dSeam{position:absolute;top:0;bottom:0;left:50%;width:19%;background:color-mix(in srgb,var(--bad) 14%,transparent);border-left:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-right:1px solid color-mix(in srgb,var(--bad) 45%,transparent);transition:opacity .3s}
.demoLane:not(.clash) .dSeam{opacity:0}
.dTimes{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:-6px 0 12px}
.demo p{margin:0 0 12px;font-size:14px;min-height:2.8em}

/* espacio de trabajo */
.ws{max-width:1560px;margin:0 auto;padding:0 clamp(12px,2.4vw,28px) 96px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.tab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:96px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left}
.tab b{font-family:var(--display);font-size:17px;font-weight:700}
.tab small{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.sumbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:2px 0 14px}
.sumbar p{margin:0;font-family:var(--display);font-size:clamp(18px,2.2vw,24px);font-weight:600;letter-spacing:-.01em;margin-right:auto;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.inspector{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);min-height:54px;font-size:13.5px}
.inspector .who2{font-weight:600}
.inspector .muted{color:var(--muted)}
.inspector input[type=time]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.zoom{margin-left:auto;display:flex;gap:6px;align-items:center}

.boardScroll{overflow:auto;max-height:68vh;position:relative;scrollbar-width:thin}
.boardInner{min-width:calc(var(--who) + var(--col)*34)}
.axis{display:flex;position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line)}
.axis .who{display:flex;align-items:flex-end;padding:0 10px 4px;font-size:12px;color:var(--muted)}
.ticks{position:relative;height:30px;width:calc(var(--col)*34);flex:none}
.tick{position:absolute;bottom:0;height:100%;border-left:1px solid var(--line);padding:6px 0 0 5px;font-size:12px;color:var(--muted);font-weight:500}
.lane{position:relative}
.laneHead{display:flex;align-items:center;gap:10px;position:sticky;left:0;width:max-content;min-width:var(--who);padding:8px 12px 6px;font-family:var(--display);font-weight:700;font-size:15px}
.laneHead i{width:10px;height:10px;border-radius:3px;background:var(--q)}
.laneHead small{font:500 12.5px var(--body);color:var(--muted)}
.laneHead .flag{background:var(--badSoft);color:var(--bad);border-radius:999px;padding:1px 9px;font:600 12px var(--body)}
.laneHead button{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.lane + .lane{border-top:1px solid var(--line)}
.rowL{display:flex;height:36px;border-top:1px solid var(--grid);position:relative;z-index:2}
.who{position:sticky;left:0;z-index:4;width:var(--who);flex:none;background:var(--panel);padding:3px 10px;display:flex;flex-direction:column;justify-content:center;line-height:1.15;border-right:1px solid var(--line)}
.who b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;flex:none;width:calc(var(--col)*34);background:repeating-linear-gradient(90deg,transparent 0 calc(var(--col)*2 - 1px),var(--grid) calc(var(--col)*2 - 1px) calc(var(--col)*2))}
.shift{position:absolute;top:5px;bottom:5px;border-radius:7px;background:color-mix(in srgb,var(--q) 12%,transparent);border:1px solid color-mix(in srgb,var(--q) 32%,transparent)}
.shift.invalid{width:calc(var(--col)*2)!important;border:1px dashed var(--bad);background:var(--badSoft);color:var(--bad);font-size:11px;padding:3px 5px;white-space:nowrap}
.chip{overflow:hidden;white-space:nowrap;position:absolute;top:4px;height:28px;border-radius:8px;background:var(--q);color:var(--chipInk);font-weight:600;font-size:11px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;z-index:3;border:0;padding:0;box-shadow:0 1px 0 rgba(0,0,0,.25);transition:box-shadow .15s}
.chip.drag{cursor:grabbing;z-index:9;box-shadow:0 8px 18px -6px rgba(0,0,0,.5);transition:none}
.chip.bad{background:repeating-linear-gradient(45deg,var(--bad) 0 6px,color-mix(in srgb,var(--bad) 68%,#000) 6px 12px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.chip.sel{outline:3px solid var(--ink);outline-offset:1px}
.chip.changed::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
@media (prefers-reduced-motion:no-preference){.chip.pulse{animation:ring 1s ease-out 2}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.seam{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--bad) 13%,transparent);border-left:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-right:1px solid color-mix(in srgb,var(--bad) 45%,transparent);z-index:1;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.seam{animation:seam 1.4s ease-in-out 3}}
@keyframes seam{50%{background:color-mix(in srgb,var(--bad) 26%,transparent)}}
.covRow{display:flex;height:70px;border-top:1px solid var(--grid)}
.covTrack{position:relative;flex:none;width:calc(var(--col)*34)}
.bar{position:absolute;bottom:3px;width:calc(var(--col) - 6px);margin-left:3px;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--q) 20%,transparent);border:1px solid color-mix(in srgb,var(--q) 40%,transparent);display:flex;align-items:flex-end;justify-content:center}
.bar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--q);font:600 10.5px/1 var(--body);color:var(--chipInk);text-align:center;padding-top:2px;font-style:normal;min-height:3px}
.bar.low i{background:var(--bad);color:#fff}
.bar.low{border-color:var(--bad)}

/* alertas */
.side{position:sticky;top:12px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.sideHead{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sideHead h2{font-size:18px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
.sideHead{flex:none}
.card{display:flex;flex:none;border-radius:12px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.card .rail{width:5px;flex:none;background:var(--c)}
.card .bd{padding:10px 12px 11px;min-width:0;flex:1}
.card.queue,.card.task,.card.cover.bad{--c:var(--bad)}
.card.cover.warn{--c:var(--warn)}
.card.data{--c:var(--info)}
.card h3{font-size:14.5px;line-height:1.25;font-weight:600;font-family:var(--body)}
.card p{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:17px;color:var(--ok);margin-bottom:4px}
.tiny{font-size:12.5px;color:var(--muted);padding:0 14px 12px}

/* barra de exportación */
.exportBar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px clamp(12px,2.4vw,28px) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.exportBar .msg{margin-right:auto;font-size:14px}
.exportBar .msg b{font-family:var(--display);font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:var(--shadow);max-width:min(92vw,560px);font-size:14px}
.toast[hidden]{display:none}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;padding:3px 10px;font-weight:600}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;max-width:min(94vw,820px);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,12,24,.55)}
.dlgHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlgHead h2{font-size:19px}
.dlgBody{padding:6px 18px 16px;max-height:60vh;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--grid)}
.arrow{color:var(--muted)}
.nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:transparent;border-radius:999px;padding:7px 15px;font-weight:600;font-size:13.5px;color:var(--muted);transition:background .2s,color .2s}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
body.page-briefing{background:radial-gradient(1000px 520px at 4% -8%,color-mix(in srgb,var(--phones) 17%,transparent),transparent 62%),radial-gradient(900px 520px at 104% 2%,color-mix(in srgb,var(--casino) 15%,transparent),transparent 58%),radial-gradient(760px 520px at 62% 112%,color-mix(in srgb,var(--chats) 13%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.bw{max-width:1180px;margin:0 auto;padding:6px clamp(14px,3vw,32px) 120px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:14px;display:flex;flex-direction:column;gap:6px}
.rs{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;border:0;background:transparent;text-align:left;font-weight:500;color:var(--muted);transition:background .2s,transform .2s}
.rs:not(:last-child)::after{content:"";position:absolute;left:25px;top:36px;height:14px;border-left:2px solid var(--line)}
.rs.done:not(:last-child)::after{border-color:var(--ok)}
.rs i{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 12.5px var(--body);font-style:normal;background:var(--panel);z-index:1}
.rs[aria-current="step"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.rs[aria-current="step"] i{background:linear-gradient(135deg,var(--phones),var(--casino));color:#fff;border-color:transparent}
.rs.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.rs[disabled]{opacity:.45;cursor:not-allowed}
.rs:not([disabled]):not([aria-current="step"]):hover{background:color-mix(in srgb,var(--panel) 70%,transparent)}
.bmain{min-width:0}
.bstep,.bres{position:relative;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:26px;padding:clamp(20px,3.4vw,40px);box-shadow:var(--shadow)}
.bstep{overflow:hidden}
.bstep>*{position:relative;z-index:1}
.bstep::before{content:attr(data-n);position:absolute;right:22px;bottom:-30px;font:800 160px/1 var(--display);color:var(--ink);opacity:.05;z-index:0;pointer-events:none}
.bstep h2,.bres h2{font-size:clamp(26px,3.6vw,42px);line-height:1.04;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.bstep h2,.bstep .bhint{max-width:min(100%,520px)}
.bhint{color:var(--muted);margin:0 0 22px;max-width:60ch}
.bhint.tight{margin:8px 0 0;font-size:13.5px}
.deco{position:absolute!important;right:-14px;top:16px;width:230px;height:150px;pointer-events:none;z-index:0!important}
.deco i{position:absolute;display:flex;align-items:center;justify-content:center;width:96px;height:34px;border-radius:11px;background:var(--q);color:var(--chipInk);font:600 13px var(--body);font-style:normal;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.deco i:nth-child(1){left:22px;top:6px;transform:rotate(-8deg)}
.deco i:nth-child(2){left:76px;top:52px;transform:rotate(5deg)}
.deco i:nth-child(3){left:34px;top:98px;transform:rotate(-3deg)}
@media (prefers-reduced-motion:no-preference){
  .deco i{animation:floaty 6s ease-in-out infinite}
  .deco i:nth-child(2){animation-delay:-2s}.deco i:nth-child(3){animation-delay:-4s}
  .bstep,.bhero{animation:rise .45s both}
  .bsess{animation:rise .5s both;animation-delay:calc(var(--i,0)*70ms)}
}
@keyframes floaty{50%{translate:0 -7px}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.binput{width:100%;font-size:20px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.binput:focus{border-color:var(--phones);box-shadow:0 0 0 4px color-mix(in srgb,var(--phones) 18%,transparent);outline:none}

<script>
/* ===== CORE: lectura, reglas, sugerencias y parche del xlsx ===== */
const DAYS_ES = { Monday: 'Lunes', Tuesday: 'Martes', Wednesday: 'Miércoles', Thursday: 'Jueves', Friday: 'Viernes', Saturday: 'Sábado', Sunday: 'Domingo' };
const QCHK = ['Phones', 'Chats', 'Tickets', 'Casino'];
const LANES = ['Phones', 'Chats', 'Tickets', 'Casino', 'Overflow'];
const PRI = { 'Vip': 0, 'Senior': 1, 'Tier 3': 2, 'Third Party': 2, 'Tier 2': 3, 'Tier 1': 4, 'New Hire': 6 };
const IGN = new Set(['Crypto']);
const AREA_UNIQUE = ['Processing', 'Decline', 'Third Party'];
const CFG = { dur: 30, minCover: 1 };
const S0 = 360, S1 = 1380, STEP = 30;
const OFFS = [30, -30, 60, -60, 90, -90, 120, -120, 150, -150];

function fmt(m) {
  if (m == null) return '—';
  const h = Math.floor(m / 60), mm = m % 60;
  return (h % 12 || 12) + ':' + String(mm).padStart(2, '0') + ' ' + (h < 12 || h === 24 ? 'am' : 'pm');
}
function fmtShort(m) { return fmt(m).replace(' ', ''); }
function fmt24(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

function toMin(cell) {
  if (!cell || cell.v == null || cell.v === '') return null;
  const v = cell.v;
  if (typeof v === 'number') return Math.round((v % 1) * 1440);
  if (v instanceof Date) return v.getHours() * 60 + v.getMinutes();
  if (typeof v === 'string') {
    const m = v.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
    if (!m) return null;
    let h = +m[1];
    if (m[3]) { const pm = m[3].toUpperCase() === 'PM'; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
    return h * 60 + +m[2];
  }
  return null;
}

function grp(area) {
  const a = (area || '').trim();
  return ['Tier 1', 'Tier 2', 'Tier 3', 'Senior'].includes(a) ? 'Tiers' : a;
}

function tokens(r) {
  if (!r.task) return [];
  return String(r.task).split('|').map(s => s.trim()).filter(p =>
    p && !/\d{1,2}(:\d{2})?\s*(AM|PM)/i.test(p) && !/^training/i.test(p) && !/^coaching with/i.test(p));
}

/* ---------- lectura del workbook ---------- */
function parseWorkbook(wb) {
  const days = [], warnings = [];
  wb.SheetNames.forEach((sheetName, di) => {
    const ws = wb.Sheets[sheetName];
    if (!ws || !ws['!ref']) return;
    const ref = XLSX.utils.decode_range(ws['!ref']);
    const last = ref.e.r + 1;
    const get = (c, r) => ws[String.fromCharCode(64 + c) + r];
    let header = null;
    for (let r = 1; r <= last; r++) {
      if ((get(8, r) && get(8, r).v === 'Break 1') || (get(17, r) && get(17, r).v === 'Break 1')) { header = r; break; }
    }
    if (!header) { warnings.push('No encontré la fila “Break 1” en la hoja ' + sheetName + '; la dejé fuera.'); return; }
    const recs = [];
    const blocks = [
      { blk: 'AM', s: 2, e: 3, area: 4, name: 5, q: 6, task: 7, b1: 8, b2: 9 },
      { blk: 'PM', s: 11, e: 12, area: 13, name: 14, q: 15, task: 16, b1: 17, b2: 18 }
    ];
    for (let r = header + 1; r <= last; r++) {
      for (const b of blocks) {
        const nm = get(b.name, r);
        if (!nm || nm.v == null || String(nm.v).trim() === '') continue;
        const b1 = toMin(get(b.b1, r)), b2 = toMin(get(b.b2, r));
        const colL = c => String.fromCharCode(64 + c);
        recs.push({
          id: di + '-' + b.blk + '-' + r, blk: b.blk, row: r,
          area: (get(b.area, r) ? String(get(b.area, r).v).trim() : ''),
          name: String(nm.v).trim(),
          queue: (get(b.q, r) ? String(get(b.q, r).v).trim() : ''),
          task: (get(b.task, r) ? String(get(b.task, r).v) : ''),
          start: toMin(get(b.s, r)), end: toMin(get(b.e, r)),
          b1, b2, o1: b1, o2: b2,
          a1: colL(b.b1) + r, a2: colL(b.b2) + r,
          ae: colL(b.e) + r, oe: toMin(get(b.e, r)),
          at: colL(b.task) + r, aq: colL(b.q) + r,
          ot: (get(b.task, r) ? String(get(b.task, r).v) : ''), oq: (get(b.q, r) ? String(get(b.q, r).v).trim() : '')
        });
      }
    }
    const m = sheetName.match(/^([A-Za-z]+)\s*(\d+)?/);
    days.push({ sheetName, dow: m ? m[1] : sheetName, dom: m && m[2] ? m[2] : '', label: (m && DAYS_ES[m[1]]) || sheetName, recs });
  });
  return { days, warnings };
}

/* ---------- reglas ---------- */
function ov(a, b) { return Math.abs(a - b) < CFG.dur; }
function breaksOf(r) { return ['b1', 'b2'].filter(k => r[k] != null).map(k => ({ r, k, t: r[k] })); }

function conflictPairs(recs) {
  const pairs = [];
  for (const q of QCHK) {
    const L = [];
    for (const r of recs) if (r.queue === q) L.push(...breaksOf(r));
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++)
      if (L[i].r !== L[j].r && ov(L[i].t, L[j].t)) pairs.push({ type: 'queue', key: q, a: L[i], b: L[j] });
  }
  for (const ar of AREA_UNIQUE) {
    const L = [];
    for (const r of recs) if (r.area === ar) L.push(...breaksOf(r));
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      if (L[i].r === L[j].r || !ov(L[i].t, L[j].t)) continue;
      if (L[i].r.queue === L[j].r.queue && QCHK.includes(L[i].r.queue)) continue;
      pairs.push({ type: 'area', key: ar, a: L[i], b: L[j] });
    }
  }
  const groups = new Map();
  const add = (key, base, role, r) => {
    if (!groups.has(key)) groups.set(key, { base, main: [], second: [] });
    groups.get(key)[role].push(r);
  };
  for (const r of recs) {
    for (const t of tokens(r)) {
      const second = /^2nd\s/i.test(t);
      const base = second ? t.replace(/^2nd\s+/i, '').trim() : t;
      if (IGN.has(base)) continue;
      add(base + '|' + grp(r.area), base, second ? 'second' : 'main', r);
    }
    if (r.queue === 'Tickets' || r.queue === 'Casino') add(r.queue + '|' + grp(r.area), r.queue, 'main', r);
  }
  for (const g of groups.values()) {
    for (const m of g.main) for (const s of g.second) {
      if (m === s) continue;
      for (const a of breaksOf(m)) for (const b of breaksOf(s))
        if (ov(a.t, b.t)) pairs.push({ type: 'task', key: g.base, a, b, aRole: 'main', bRole: '2nd' });
    }
  }
  return pairs;
}

function coverage(recs, q) {
  const dur = CFG.dur, out = [];
  const qr = recs.filter(r => r.queue === q && r.start != null && r.end != null && r.end > r.start);
  for (let s = S0; s < S1; s += STEP) {
    const on = qr.filter(r => r.start <= s && s < r.end);
    const br = on.filter(r => ['b1', 'b2'].some(k => r[k] != null && r[k] < s + STEP && r[k] + dur > s));
    out.push({ s, on: on.length, work: on.length - br.length, onBreak: br.map(r => r.name) });
  }
  return out;
}

function thinCount(recs) {
  let n = 0;
  for (const q of ['Phones', 'Chats']) for (const c of coverage(recs, q)) if (c.on >= 2 && c.work <= CFG.minCover) n++;
  return n;
}

function buildIssues(day, skipTasks) {
  const recs = day.recs, issues = [];
  const pairs = conflictPairs(recs);
  const byKey = new Map();
  for (const p of pairs) { const k = p.type + '|' + p.key; if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(p); }
  for (const ps of byKey.values()) {
    const parent = new Map(), node = new Map();
    const id = it => it.r.id + ':' + it.k;
    const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
    for (const p of ps) {
      [[p.a, p.aRole], [p.b, p.bRole]].forEach(([it, role]) => {
        const i = id(it);
        if (!parent.has(i)) { parent.set(i, i); node.set(i, { r: it.r, k: it.k, role: role || null }); }
        else if (role) node.get(i).role = role;
      });
      parent.set(find(id(p.a)), find(id(p.b)));
    }
    const comps = new Map();
    for (const i of parent.keys()) { const root = find(i); if (!comps.has(root)) comps.set(root, []); comps.get(root).push(node.get(i)); }
    for (const items of comps.values()) {
      items.forEach(it => { it.t = it.r[it.k]; });
      items.sort((a, b) => a.t - b.t);
      issues.push({ type: ps[0].type, key: ps[0].key, items, time: items[0].t, id: ps[0].type + '|' + ps[0].key + '|' + items.map(i => i.r.id + i.k + i.t).join(',') });
    }
  }
  // cobertura
  for (const q of ['Phones', 'Chats']) {
    const cov = coverage(recs, q);
    const firstOn = cov.findIndex(c => c.on > 0);
    let lastOn = -1; cov.forEach((c, i) => { if (c.on > 0) lastOn = i; });
    const kindOf = (c, i) => {
      if (firstOn >= 0 && i >= firstOn && i <= lastOn && c.on === 0) return 'empty';
      if (c.on >= 2 && c.work <= CFG.minCover) return 'thin';
      if (c.on === 1) return 'solo';
      return null;
    };
    let run = null;
    const flush = () => { if (run) { issues.push(run); run = null; } };
    cov.forEach((c, i) => {
      const kind = kindOf(c, i);
      if (!kind) { flush(); return; }
      if (run && run.kind === kind && run.to === c.s) { run.to = c.s + STEP; run.minWork = Math.min(run.minWork, c.work); c.onBreak.forEach(n => { if (!run.names.includes(n)) run.names.push(n); }); }
      else { flush(); run = { type: 'cover', key: q, kind, from: c.s, to: c.s + STEP, time: c.s, minWork: c.work, on: c.on, names: [...c.onBreak], id: 'cover|' + q + '|' + kind + '|' + c.s }; }
    });
    flush();
  }
  // datos
  for (const r of recs) {
    if (r.start != null && r.end != null && r.end <= r.start)
      issues.push({ type: 'data', key: 'turno', time: r.start, rec: r, text: r.name + ' tiene turno ' + fmt(r.start) + ' a ' + fmt(r.end), hint: 'La salida no es posterior a la entrada, así que no cuento a esta persona en la cobertura.', fix: { rec: r, to: r.start + 480 }, id: 'data|turno|' + r.id });
    else if (r.start != null && r.end != null && r.b1 == null && r.b2 == null && (r.end - r.start) >= 360)
      issues.push({ type: 'data', key: 'sinbreak', time: r.start, rec: r, text: r.name + ' no tiene breaks (' + fmt(r.start) + '–' + fmt(r.end) + ')', hint: 'Confirma si es a propósito (por ejemplo, capacitación).', id: 'data|sinbreak|' + r.id });
    else if (r.start != null && r.end != null && r.end > r.start && r.b1 != null && r.b2 != null) {
      const o1 = r.b1 - r.start, o2 = r.b2 - r.start, gap = r.b2 - r.b1, left = r.end - r.b2;
      const why = [];
      if (r.b1 < r.start || r.b2 + CFG.dur > r.end) why.push('un break cae fuera del turno');
      else {
        if (o1 < 90 || o1 > 270) why.push('el Break 1 queda a ' + (o1 / 60).toFixed(1) + ' h de la entrada');
        if (o2 < 270 || left < 60) why.push('el Break 2 queda a ' + (o2 / 60).toFixed(1) + ' h de la entrada y ' + (left / 60).toFixed(1) + ' h antes de salir');
        if (gap < 150) why.push('entre breaks hay solo ' + (gap / 60).toFixed(1) + ' h');
      }
      if (why.length) issues.push({ type: 'data', key: 'horario', time: r.b1, rec: r, text: r.name + ': ' + why.join('; '), hint: 'Turno ' + fmt(r.start) + '–' + fmt(r.end) + ', breaks ' + fmt(r.b1) + ' y ' + fmt(r.b2) + '.', id: 'data|horario|' + r.id + r.b1 + r.b2 });
    }
  }
  if (!skipTasks) taskIssues(day).forEach(i => issues.push(i));
  issues.sort((a, b) => a.time - b.time);
  return issues;
}

/* ---------- sugerencias ---------- */
function badness(recs) { return conflictPairs(recs).length * 100 + thinCount(recs); }

function validMove(r, k, nt) {
  if (r.start == null || r.end == null || r.end <= r.start) return false;
  if (nt < r.start || nt + CFG.dur > r.end || nt % STEP !== 0) return false;
  if (k === 'b1') { if (nt < r.start + 90 || nt > r.start + 270) return false; if (r.b2 != null && r.b2 - nt < 150) return false; }
  else { if (nt < r.start + 270 || nt > r.end - 60) return false; if (r.b1 != null && nt - r.b1 < 150) return false; }
  return true;
}

function bestMove(day, cands) {
  const recs = day.recs, base = badness(recs);
  let best = null;
  for (const { r, k } of cands) {
    const old = r[k];
    for (const off of OFFS) {
      const nt = old + off;
      if (!validMove(r, k, nt)) continue;
      r[k] = nt;
      const b = badness(recs);
      r[k] = old;
      if (b < base) {
        const sc = [b, -(PRI[r.area] != null ? PRI[r.area] : 3), Math.abs(off)];
        if (!best || sc[0] < best.sc[0] || (sc[0] === best.sc[0] && (sc[1] < best.sc[1] || (sc[1] === best.sc[1] && sc[2] < best.sc[2]))))
          best = { sc, r, k, from: old, to: nt };
      }
    }
  }
  return best ? { r: best.r, k: best.k, from: best.from, to: best.to } : null;
}

function candidatesFor(day, issue) {
  if (issue.type === 'queue' || issue.type === 'task' || issue.type === 'area') return issue.items.map(i => ({ r: i.r, k: i.k }));
  if (issue.type === 'cover' && issue.kind === 'thin') {
    const c = [];
    for (const r of day.recs) if (r.queue === issue.key) for (const k of ['b1', 'b2'])
      if (r[k] != null && r[k] < issue.to && r[k] + CFG.dur > issue.from) c.push({ r, k });
    return c;
  }
  return [];
}

function fixTime(day, r) {
  const base = badness(day.recs);
  for (const k of ['b1', 'b2']) {
    if (r[k] == null || validMove(r, k, r[k])) continue;
    const cand = OFFS.slice().sort((a, b) => Math.abs(a) - Math.abs(b) || b - a);
    const wide = []; for (let o = 30; o <= 300; o += 30) wide.push(o, -o);
    wide.sort((a, b) => Math.abs(a) - Math.abs(b) || b - a);
    let best = null;
    for (const off of wide) {
      const nt = r[k] + off;
      if (!validMove(r, k, nt)) continue;
      const old = r[k]; r[k] = nt; const b = badness(day.recs); r[k] = old;
      if (b <= base) { best = { r, k, from: old, to: nt }; break; }
    }
    if (best) return best;
  }
  return null;
}

function suggestFor(day, issue) {
  if (issue.type === 'data' && issue.key === 'horario') return fixTime(day, issue.rec);
  const c = candidatesFor(day, issue);
  return c.length ? bestMove(day, c) : null;
}

function autoFix(day) {
  const moves = [];
  for (let n = 0; n < 120; n++) {
    const issues = buildIssues(day, true).filter(i => i.type === 'queue' || i.type === 'task' || i.type === 'area' || (i.type === 'cover' && i.kind === 'thin'));
    let done = false;
    for (const is of issues) {
      const m = suggestFor(day, is);
      if (m) { m.r[m.k] = m.to; moves.push(m); done = true; break; }
    }
    if (!done) break;
  }
  return moves;
}

/* ===== TASKS: revisión de asignación con la lógica del macro Task Maker ===== */
const MORNING_CUT = 780; // entrada antes de la 1:00 pm = mañana (igual que el macro)
const T_PROC = {
  AM5_MT: ['Slack | Balances | Pending | Crypto', 'Emails | Zelle | Crypto', 'NSU | 2nd Zelle | Crypto', 'Banking | 2nd Emails | 2nd Slack | Crypto', 'Monitoring | Audit | Crypto'],

  PM4: ['Slack | Balances | Pending | Crypto', 'Emails | Zelle | Crypto', 'NSU | Monitoring | Audit | Crypto', '2nd Emails | 2nd Slack | 2nd Zelle | Crypto'],
  PM3: ['Slack | 2nd Emails | Balances | Pending | Crypto', 'Emails | Zelle | 2nd Slack | Crypto', 'NSU | Monitoring | Audit | 2nd Zelle | Crypto']
};
const T_DECLINE2 = 'FTDs | Processors | Scrubbers | Velocity';
const T_DECLINE3 = ['FTDs | Processors | Velocity', 'Scrubbers | Monitoring | Slack', 'FTDs | Processors | Velocity'];
const T_CASINO1 = 'Slack | Reports | Notion | Payout Tracker | 3rd Party Tickets';
const T_CASINO_A = 'Slack | Reports | Notion';
const T_CASINO_B_MT = '2nd Casino | Payout Tracker | 3rd Party Tickets';
const T_CASINO_B_FS = 'Payout Tracker | 3rd Party Tickets';
const T_VIP1 = 'Vip Emails | Vip Payouts Tracking';
const T_VIP_P = 'Vip Emails';
const T_VIP_B = '2nd Vip Emails | Vip Payouts Tracking';
const T_ST = ['Emails', '2nd Emails', 'Bonuses', '2nd Tickets | 2nd Bonuses', '3rd Tickets | 3rd Bonuses'];
const T_TRAIN_AD = 'Copilot | Quality Module';
const TRAINERS = ['kendra temple', 'natalia sibaja', 'victor ramirez'];

const nt = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
function splitTask(r) {
  const main = [], note = [];
  String(r.task || '').split('|').map(s => s.trim()).filter(Boolean).forEach(p => {
    if (/\d{1,2}(:\d{2})?\s*(AM|PM)/i.test(p) || /^training/i.test(p) || /^coaching with/i.test(p)) note.push(p); else main.push(p);
  });
  return { main, note };
}
const mainSet = r => new Set(splitTask(r).main.map(nt));
const groupToks = g => g.split('|').map(s => nt(s));
const holds = (r, g) => { const s = mainSet(r); return groupToks(g).every(t => s.has(t)); };
const mainText = r => splitTask(r).main.join(' | ');
const withTask = (r, text) => [text].concat(splitTask(r).note).filter(Boolean).join(' | ');
const isAM = r => r.start != null && r.start < MORNING_CUT;
const validShift = r => r.start != null && r.end != null && r.end > r.start;
const shiftName = am => am ? 'mañana' : 'tarde';

function pairedGroups(a, b) {
  const has = (g, name) => groupToks(g).includes(nt(name));
  for (const t of a.split('|').map(s => s.trim())) if (/^2nd /i.test(t) && has(b, t.slice(4))) return true;
  for (const t of b.split('|').map(s => s.trim())) if (/^2nd /i.test(t) && has(a, t.slice(4))) return true;
  return false;
}

const mk = o => Object.assign({ status: 'ok', cands: [], holder: null, holders: [], soft: false, time: 360, miss: '', ctx: '' }, o);
const IGN_T = new Set(['crypto']);
const rawToks = g => g.split('|').map(s => s.trim()).filter(Boolean);
const reqToks = g => rawToks(g).filter(t => !IGN_T.has(nt(t)));
const holdersOf = (pool, tok) => pool.filter(r => mainSet(r).has(nt(tok)));
const uniq = a => Array.from(new Set(a));
const addOp = (rec, tokens, queue) => ({ type: 'add', rec, tokens, queue: queue || null });
const moveTokOp = (from, to, tokens) => ({ type: 'movetok', from, to, tokens });
const nTok = (r, toks) => toks.filter(t => mainSet(r).has(nt(t))).length;

/* un candidato es válido si no deja a un task y su 2nd con la misma hora de entrada */
function tokOk(pool, r, missing, allToks, am) {
  const norm = new Set(allToks.map(nt));
  for (const t of missing) {
    if (/^2nd /i.test(t)) { const b = t.slice(4).trim(); if (norm.has(nt(b)) && holdersOf(pool, b).some(h => h === r || h.start === r.start)) return false; }
    else if (norm.has(nt('2nd ' + t)) && holdersOf(pool, '2nd ' + t).some(h => h === r || h.start === r.start)) return false;
    if (am && ['balances', 'pending'].includes(nt(t)) && r.start !== 360) return false;
  }
  return true;
}

/* revisa task por task: basta con que alguien del turno lo tenga escrito, en el orden que sea */
function coverGroups(E, base, pool, groups, o) {
  o = o || {};
  const allToks = uniq(groups.reduce((a, g) => a.concat(reqToks(g)), []));
  groups.forEach(g => {
    const toks = reqToks(g);
    const missing = toks.filter(t => !holdersOf(pool, t).length);
    const holders = uniq(pool.filter(r => toks.some(t => mainSet(r).has(nt(t)))));
    const whole = missing.length === toks.length;
    const e = mk(Object.assign({}, base, { group: g, holder: holders[0] || null, holders, status: missing.length ? 'missing' : 'ok', miss: whole ? g : missing.join(' | '), ctx: whole ? '' : g, note: o.note || '' }));
    if (missing.length) {
      const ranked = pool.slice().sort((a, b) => (nTok(b, toks) - nTok(a, toks)) || (splitTask(a).main.length - splitTask(b).main.length));
      ranked.forEach(r => {
        if (!tokOk(pool, r, missing, allToks, o.am)) return;
        const have = nTok(r, toks);
        e.cands.push({ rec: r, why: have ? 'ya lleva ' + have + ' de ese grupo' : (mainText(r) ? 'ahora tiene: ' + mainText(r) : 'sin task'), op: addOp(r, missing, o.queue ? o.queue(g) : null) });
      });
    }
    E.push(e);
  });
  return allToks;
}

/* reglas: un task y su 2nd no pueden entrar a la misma hora */
function pairRules(E, base, pool, allToks, am) {
  const norm = new Set(allToks.map(nt));
  allToks.forEach(t => {
    if (!/^2nd /i.test(t)) return;
    const b = t.slice(4).trim(); if (!norm.has(nt(b))) return;
    const HB = holdersOf(pool, b), H2 = holdersOf(pool, t);
    if (!HB.length || !H2.length) return;
    if (HB.some(x => H2.some(y => x !== y && x.start !== y.start))) return;
    const e = mk(Object.assign({}, base, { group: b + ' / ' + t, holder: HB[0], status: 'rule', text: '“' + b + '” y “' + t + '” los llevan personas que entran a la misma hora (' + joinPeople(HB) + ' y ' + joinPeople(H2) + ').' }));
    pool.forEach(p => {
      if (HB.includes(p) || H2.includes(p)) return;
      if (!HB.some(x => x.start === p.start)) e.cands.push({ rec: p, why: 'entra ' + fmt(p.start) + ', para “' + t + '”', op: moveTokOp(H2, p, [t]) });
      else if (!H2.some(x => x.start === p.start)) e.cands.push({ rec: p, why: 'entra ' + fmt(p.start) + ', para “' + b + '”', op: moveTokOp(HB, p, [b]) });
    });
    E.push(e);
  });
}
const joinPeople = a => uniq(a.map(r => r.name)).join(' y ');

/* ---------- Processing ---------- */
function planProcessing(day, E) {
  const fsDay = ['Friday', 'Saturday', 'Sunday'].includes(day.dow);
  [true, false].forEach(am => {
    const shift = shiftName(am), time = am ? 360 : 900, base = { dept: 'Processing', shift, time };
    const pool = day.recs.filter(r => r.area === 'Processing' && validShift(r) && isAM(r) === am);
    const n = pool.length;
    if (!n) { E.push(mk(Object.assign({}, base, { group: 'Turno', status: 'empty', text: 'No hay nadie de Processing en el turno de la ' + shift + '.' }))); return; }
    const tpl = T_PROC[am ? 'AM' + Math.max(4, Math.min(5, n)) + (fsDay ? '_FS' : '_MT') : 'PM' + Math.max(3, Math.min(4, n))];
    const off = am ? (n < 4 || n > 5) : (n < 3 || n > 4);
    const note = off ? 'Hoy hay ' + n + ' personas y el macro reparte con ' + (am ? '4 o 5' : '3 o 4') + '.' : '';
    const allToks = coverGroups(E, base, pool, tpl, { am, note });
    pairRules(E, base, pool, allToks, am);
    if (am) {
      const hb = uniq(holdersOf(pool, 'Balances').concat(holdersOf(pool, 'Pending')));
      if (hb.length && !hb.some(r => r.start === 360)) {
        const e = mk(Object.assign({}, base, { group: 'Balances | Pending', holder: hb[0], status: 'rule', text: 'Balances y Pending de la mañana los lleva ' + joinPeople(hb) + ', y el macro los da a quien entra a las 6:00 am.' }));
        pool.filter(p => p.start === 360 && !hb.includes(p)).forEach(p => e.cands.push({ rec: p, why: 'entra 6:00 am', op: moveTokOp(hb, p, ['Balances', 'Pending']) }));
        E.push(e);
      }
    }
  });
}

/* ---------- Senior / Tier 3 / Tier 2 ---------- */
function stSearch(c, am, pins) {
  const mid = am ? 540 : 780, pref = am ? 360 : 900, cur = [-1, -1, -1, -1, -1, -1], best = [-1, -1, -1, -1, -1, -1];
  let bestScore = -1;
  const dept = i => String(c[i].area).toUpperCase();
  const used = i => { for (let k = 1; k <= 5; k++) if (cur[k] === i) return true; return false; };
  const eligible = (i, role) => {
    if (role <= 2 && dept(i) !== 'SENIOR' && dept(i) !== 'TIER 3') return false;
    if (role >= 4) for (let k = 3; k < role; k++) if (cur[k] >= 0 && c[cur[k]].start === c[i].start) return false;
    return true;
  };
  const score = () => {
    const emails = (cur[1] >= 0) + (cur[2] >= 0);
    const iv = [];
    for (let k = 3; k <= 5; k++) if (cur[k] >= 0) iv.push([Math.max(c[cur[k]].start, 360), Math.min(c[cur[k]].end, 1380)]);
    let cov = 0;
    if (iv.length) {
      iv.sort((a, b) => a[0] - b[0]);
      let ce = iv[0][1], covered = iv[0][1] - iv[0][0], gap = 0;
      for (let i = 1; i < iv.length; i++) {
        if (iv[i][0] > ce) { gap += iv[i][0] - ce; covered += iv[i][1] - iv[i][0]; ce = iv[i][1]; }
        else if (iv[i][1] > ce) { covered += iv[i][1] - ce; ce = iv[i][1]; }
      }
      cov = covered - gap * 0.25;
    }
    const pf = (cur[3] >= 0 && c[cur[3]].start === pref) ? 500 : 0;
    return emails * 1e9 + (cur[3] >= 0) * 1e8 + (cur[4] >= 0) * 1e7 + (cur[5] >= 0) * 1e6 + cov * 10 + pf;
  };
  const rec = role => {
    if (role > 5) { const s = score(); if (s > bestScore) { bestScore = s; for (let k = 1; k <= 5; k++) best[k] = cur[k]; } return; }
    if (role === 2 && cur[1] < 0) { cur[2] = -1; rec(3); return; }
    if (role === 4 && cur[3] < 0) { cur[4] = -1; rec(5); return; }
    if (role === 5) {
      if (cur[3] < 0 || cur[4] < 0 || c[cur[4]].start !== mid) { cur[5] = -1; rec(6); return; }
    }
    if (pins[role] !== undefined) {
      const p = pins[role];
      if (!used(p) && eligible(p, role)) { cur[role] = p; rec(role + 1); cur[role] = -1; }
      return;
    }
    for (let i = 0; i < c.length; i++) if (!used(i) && eligible(i, role)) { cur[role] = i; rec(role + 1); cur[role] = -1; }
    cur[role] = -1; rec(role + 1);
  };
  rec(1);
  return bestScore < 0 ? null : best;
}

function planSenior(day, E) {
  [true, false].forEach(am => {
    const c = day.recs.filter(r => ['Senior', 'Tier 3', 'Tier 2'].includes(r.area) && validShift(r) && isAM(r) === am && ['Phones', 'Chats', 'Tickets'].includes(r.queue));
    const shift = shiftName(am), time = am ? 360 : 900, base = { dept: 'Senior / Tier', shift, time };
    if (!c.length) { E.push(mk(Object.assign({}, base, { group: 'Turno', status: 'empty', text: 'No hay nadie de Senior, Tier 3 o Tier 2 en la ' + shift + '.' }))); return; }
    const toksOf = k => reqToks(T_ST[k - 1]);
    // quién lleva cada rol (por task suelto, sin importar el orden ni cómo estén agrupados)
    const holder = [null], usedIdx = new Set();
    for (let k = 1; k <= 5; k++) {
      let h = -1, bestN = 0;
      c.forEach((r, i) => { if (usedIdx.has(i)) return; const n = nTok(r, toksOf(k)); if (n > bestN) { bestN = n; h = i; } });
      if (h >= 0) usedIdx.add(h);
      holder.push(h >= 0 ? h : null);
    }
    const missingOf = k => toksOf(k).filter(t => !holdersOf(c, t).length);
    let best = null, pins = {};
    for (let k = 1; k <= 5; k++) if (holder[k] !== null && !missingOf(k).length) pins[k] = holder[k];
    for (let tries = 0; tries <= 5; tries++) {
      best = stSearch(c, am, pins);
      if (best) break;
      const drop = [5, 4, 3, 2, 1].find(k => pins[k] !== undefined); if (!drop) break;
      delete pins[drop];
    }
    best = best || [-1, -1, -1, -1, -1, -1];
    const mid = am ? 540 : 780;
    const r4 = holder[4] !== null ? c[holder[4]] : (best[4] >= 0 ? c[best[4]] : null);
    const needThird = !!(r4 && r4.start === mid);
    const startsOf = k => (holder[k] !== null ? holder[k] : best[k]);
    for (let k = 1; k <= 5; k++) {
      const g = T_ST[k - 1], miss = missingOf(k);
      if (k === 5 && !needThird && !toksOf(5).some(t => holdersOf(c, t).length)) continue;
      const holders = uniq(c.filter(r => toksOf(k).some(t => mainSet(r).has(nt(t)))));
      const whole = miss.length === toksOf(k).length;
      const e = mk(Object.assign({}, base, { group: g, holder: holders[0] || null, holders, status: miss.length ? 'missing' : 'ok', miss: whole ? g : miss.join(' | '), ctx: whole ? '' : g }));
      if (miss.length) {
        const seen = new Set(), q = (k === 3 && whole) ? 'Tickets' : null;
        const alts = c.map((r, i) => i).filter(i => {
          const d = String(c[i].area).toUpperCase();
          if (k <= 2 && d !== 'SENIOR' && d !== 'TIER 3') return false;
          if ([1, 2, 3, 4, 5].some(x => x !== k && toksOf(x).some(t => mainSet(c[i]).has(nt(t))))) return false;
          if (k === 1 && holdersOf(c, '2nd Emails').includes(c[i])) return false;
          if (k === 2 && holdersOf(c, 'Emails').includes(c[i])) return false;
          if (k >= 4) for (let x = 3; x < k; x++) { const hx = startsOf(x); if (hx !== null && hx >= 0 && c[hx].start === c[i].start) return false; }
          return true;
        }).sort((a, b) => nTok(c[b], toksOf(k)) - nTok(c[a], toksOf(k)));
        const first = (!whole && holder[k] !== null) ? [holder[k]] : (best[k] >= 0 ? [best[k]] : []);
        first.concat(alts).forEach(i => {
          if (seen.has(i)) return; seen.add(i);
          e.cands.push({ rec: c[i], why: c[i].area + ', entra ' + fmt(c[i].start) + (mainText(c[i]) ? ', ahora tiene: ' + mainText(c[i]) : ''), op: addOp(c[i], miss, q) });
        });
        if (k === 5) e.note = 'El 2nd Tickets entra a la hora intermedia, así que el macro pide también un 3rd.';
      }
      E.push(e);
    }
    // reacomodo completo con la búsqueda del macro, solo si cubre más roles sin quitar ninguno
    if ([1, 2].some(k => missingOf(k).length)) {
      const filledNow = [1, 2, 3, 4, 5].filter(k => (holder[k] !== null && !missingOf(k).length) || best[k] >= 0).length;
      const pin3 = (holder[3] !== null && !missingOf(3).length) ? { 3: holder[3] } : {};
      const full = stSearch(c, am, pin3) || stSearch(c, am, {});
      if (full) {
        const filledFull = [1, 2, 3, 4, 5].filter(k => full[k] >= 0).length;
        const keeps = [1, 2, 3, 4, 5].every(k => holder[k] === null || missingOf(k).length || full[k] >= 0);
        if (filledFull > filledNow && keeps) {
          const ops = [], desc = [];
          for (let k = 1; k <= 5; k++) if (holder[k] !== null && holder[k] !== full[k] && !missingOf(k).length) ops.push({ type: 'put', rec: c[holder[k]], task: '', queue: null });
          for (let k = 1; k <= 5; k++) if (full[k] >= 0 && (holder[k] !== full[k] || missingOf(k).length)) { ops.push({ type: 'put', rec: c[full[k]], task: T_ST[k - 1], queue: k === 3 ? 'Tickets' : null }); desc.push(c[full[k]].name + ' lleva ' + T_ST[k - 1]); }
          E.push(mk(Object.assign({}, base, { group: 'Reacomodo', status: 'rule', text: 'Con la lógica del macro se cubren ' + filledFull + ' de 5 roles en la ' + shift + ' (hoy ' + filledNow + '): ' + desc.join('; ') + '.', cands: [{ rec: null, label: 'Aplicar el reacomodo del macro', why: desc.join('; '), op: { type: 'multi', ops } }] })));
        }
      }
    }
    // reglas
    [1, 2].forEach(k => toksOf(k).forEach(t => holdersOf(c, t).filter(r => String(r.area).toUpperCase() === 'TIER 2').forEach(r =>
      E.push(mk(Object.assign({}, base, { group: t, holder: r, status: 'rule', text: r.name + ' es Tier 2 y lleva “' + t + '”; el macro solo lo da a Senior o Tier 3.' }))))));
    [[3, 4], [3, 5], [4, 5]].forEach(([a, b]) => {
      if (holder[a] !== null && holder[b] !== null && c[holder[a]].start === c[holder[b]].start) {
        const e = mk(Object.assign({}, base, { group: T_ST[a - 1] + ' / ' + T_ST[b - 1], holder: c[holder[b]], status: 'rule', text: c[holder[a]].name + ' y ' + c[holder[b]].name + ' entran a la misma hora y llevan Tickets en distintos niveles (principal, 2nd o 3rd).' }));
        c.forEach((p, i) => {
          if (holder.includes(i)) return;
          const clash = [3, 4, 5].some(q => q !== b && holder[q] !== null && c[holder[q]].start === p.start);
          if (!clash) e.cands.push({ rec: p, why: p.area + ', entra ' + fmt(p.start), op: { type: 'move', from: c[holder[b]], to: p, task: T_ST[b - 1] } });
        });
        E.push(e);
      }
    });
  });
}

function planDay(day) {
  const E = [];
  planProcessing(day, E); planTraining(day, E); planDecline(day, E); planCasino(day, E); planVip(day, E); planSenior(day, E);
  return E;
}

function taskIssues(day) {
  const out = [];
  planDay(day).forEach(e => {
    if (e.status === 'ok') return;
    const base = { type: 'assign', dept: e.dept, shift: e.shift, group: e.group, time: e.time, cands: e.cands, soft: !!e.soft, note: e.note || '', ctx: e.ctx || '' };
    if (e.status === 'missing') out.push(Object.assign(base, { kind: 'missing', group: e.miss, id: 'assign|' + e.dept + '|' + e.shift + '|' + e.miss + '|missing' }));
    else if (e.status === 'rule') out.push(Object.assign(base, { kind: 'rule', text: e.text, id: 'assign|' + e.dept + '|' + e.shift + '|' + e.group + '|rule|' + (e.holder ? e.holder.id : '') }));
    else out.push(Object.assign(base, { kind: e.status, text: e.text, id: 'assign|' + e.dept + '|' + e.shift + '|' + e.group + '|' + e.status }));
  });
  return out;
}

/* aplica una acción (asignar, intercambiar o mover) y devuelve los cambios hechos */
function runOp(op) {
  const mv = [];
  const setF = (rec, k, v) => { if (rec[k] !== v) { mv.push({ rec, k, from: rec[k] }); rec[k] = v; } };
  if (op.type === 'set') { setF(op.rec, 'task', withTask(op.rec, op.task)); if (op.queue) setF(op.rec, 'queue', op.queue); }
  else if (op.type === 'swap') { const ta = mainText(op.a), tb = mainText(op.b); setF(op.a, 'task', withTask(op.a, tb)); setF(op.b, 'task', withTask(op.b, ta)); }
  else if (op.type === 'add') {
    const have = new Set(mainSet(op.rec)), add = op.tokens.filter(t => !have.has(nt(t)));
    if (add.length) setF(op.rec, 'task', withTask(op.rec, splitTask(op.rec).main.concat(add).join(' | ')));
    if (op.queue) setF(op.rec, 'queue', op.queue);
  }
  else if (op.type === 'movetok') {
    const drop = new Set(op.tokens.map(nt));
    op.from.forEach(r => { const keep = splitTask(r).main.filter(t => !drop.has(nt(t))); if (keep.length !== splitTask(r).main.length) setF(r, 'task', withTask(r, keep.join(' | '))); });
    const have = new Set(mainSet(op.to)), add = op.tokens.filter(t => !have.has(nt(t)));
    if (add.length) setF(op.to, 'task', withTask(op.to, splitTask(op.to).main.concat(add).join(' | ')));
  }
  else if (op.type === 'put') { setF(op.rec, 'task', withTask(op.rec, op.task)); if (op.queue) setF(op.rec, 'queue', op.queue); }
  else if (op.type === 'multi') { op.ops.forEach(o => { runOp(o).forEach(m => mv.push(m)); }); }
  else if (op.type === 'move') { setF(op.to, 'task', withTask(op.to, op.task)); setF(op.from, 'task', withTask(op.from, '')); }
  return mv;
}

/* ===== BRIEFING CREATOR: motor que arma las sesiones ===== */
const BR_STEP = 15;
const BR_EDGE = 60; // nunca en la primera ni en la última hora del turno de una persona
let BR_OPTS = null;
function brSetOpts(o) { BR_OPTS = o; }
/* hora más temprana permitida para esta persona (la que eligió el usuario: mañana o tarde) */
function brEarliest(r) {
  const o = BR_OPTS; if (!o) return 0;
  if (o.start2 != null) return r.start >= 780 ? o.start2 : o.start;
  if (o.winLo != null) return o.winLo;
  return 0;
}
const BR_DAY_START = 360, BR_DAY_END = 1380;
const brFirst = n => String(n).split(' ')[0];

/* quién ya está fuera en cada momento: breaks de todos + sesiones ya puestas */
function brAways(day, extra) {
  const out = [];
  day.recs.forEach(r => {
    if (!validShift(r)) return;
    ['b1', 'b2'].forEach(k => { if (r[k] != null) out.push({ rec: r, s: r[k], e: r[k] + CFG.dur, why: 'break de las ' + fmt(r[k]) }); });
  });
  return out.concat(extra || []);
}

/* quién respalda a quién: el principal y su 2nd (y el 3rd) del mismo equipo */
function brPartners(day, r) {
  const mine = splitTask(r).main.map(nt).filter(t => t && !IGN_T.has(t));
  const out = new Set();
  day.recs.forEach(o => {
    if (o === r || grp(o.area) !== grp(r.area) || !validShift(o) || isAM(o) !== isAM(r)) return;
    const os = mainSet(o);
    for (const n of mine) {
      let hit = false;
      if (/^2nd /.test(n)) { const b = n.slice(4); hit = os.has(b) || os.has('3rd ' + b); }
      else if (/^3rd /.test(n)) hit = os.has('2nd ' + n.slice(4));
      else hit = os.has('2nd ' + n);
      if (hit) { out.add(o); break; }
    }
  });
  return Array.from(out);
}

/* cuántas personas están fuera a la vez, como máximo, dentro de la ventana */
function brPeak(items, t, e) {
  const ev = [];
  items.forEach(a => { ev.push([Math.max(a.s, t), 1], [Math.min(a.e, e), -1]); });
  ev.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  let cur = 0, mx = 0;
  ev.forEach(x => { cur += x[1]; if (cur > mx) mx = cur; });
  return mx;
}

/* tope efectivo: una sesión estricta ya puesta no se puede romper con una relajada encima */
const brCapEff = (xs, cap) => xs.reduce((m, a) => a.sc != null ? Math.min(m, a.sc) : m, cap);

/* ¿puede esta persona estar en el briefing de t a e sin romper nada? (cap = máximo fuera a la vez por cola o por área) */
function brCheck(day, r, t, e, aways, cap) {
  cap = cap || 1;
  if (!validShift(r)) return { ok: false, code: 'turno', reason: 'su turno no está bien escrito' };
  if (t < r.start || e > r.end) return { ok: false, code: 'turno', reason: 'su turno (' + fmt(r.start) + ' a ' + fmt(r.end) + ') no cubre ese horario' };
  if (t < r.start + BR_EDGE || e > r.end - BR_EDGE) return { ok: false, code: 'borde', reason: 'no puede ser en su primera ni en su última hora de turno (' + fmt(r.start) + ' a ' + fmt(r.end) + ')' };
  const early = brEarliest(r);
  if (t < early) return { ok: false, code: 'hora', reason: 'queda antes de las ' + fmt(early) + ', que es cuando se puede empezar' };
  for (const k of ['b1', 'b2']) {
    if (r[k] != null && r[k] < e && r[k] + CFG.dur > t) return { ok: false, code: 'break', k, reason: 'su break de las ' + fmt(r[k]) + ' se cruza' };
  }
  const ovl = x => x.s < e && x.e > t;
  if (QCHK.includes(r.queue)) {
    const xs = aways.filter(a => a.rec !== r && a.rec.queue === r.queue && ovl(a));
    if (xs.length && brPeak(xs, t, e) + 1 > brCapEff(xs, cap)) return { ok: false, code: 'cola', reason: 'en ' + r.queue + ' ya está fuera ' + brFirst(xs[0].rec.name) + ' (' + xs[0].why + ')' };
  }
  if (AREA_UNIQUE.includes(r.area)) {
    const xs = aways.filter(a => a.rec !== r && a.rec.area === r.area && ovl(a));
    if (xs.length && brPeak(xs, t, e) + 1 > brCapEff(xs, cap)) return { ok: false, code: 'area', reason: 'en ' + r.area + ' ya está fuera ' + brFirst(xs[0].rec.name) + ' (' + xs[0].why + ')' };
  }
  const ps = brPartners(day, r);
  const bad = ps.find(p => aways.some(a => a.rec === p && ovl(a)));
  if (bad) return { ok: false, code: 'task', reason: 'su respaldo de task, ' + brFirst(bad.name) + ', estaría fuera' };
  const soft = [];
  ps.forEach(p => { if (validShift(p) && (p.start > t || p.end < e)) soft.push(brFirst(p.name) + ' (respaldo de sus tasks) no está en turno todo ese rato'); });
  return { ok: true, soft };
}

/* rango de horas en el que se pueden poner sesiones: franja elegida o hora fija con margen */
function brRange(opts) {
  if (opts.winLo != null) return { lo: opts.winLo, hi: opts.winHi };
  if (opts.tol == null) return { lo: BR_DAY_START, hi: BR_DAY_END };
  return { lo: Math.max(BR_DAY_START, opts.start - opts.tol), hi: Math.min(BR_DAY_END, opts.start + opts.tol + opts.dur) };
}
const brPrefs = opts => [opts.start].concat(opts.start2 != null ? [opts.start2] : []);
const brDist = (opts, t) => Math.min.apply(null, brPrefs(opts).map(p => Math.abs(t - p)));
function brGrid(lo, hi, dur, opts) {
  const out = [];
  for (let t = lo; t + dur <= hi; t += BR_STEP) out.push(t);
  brPrefs(opts).forEach(p => { if (p >= lo && p + dur <= hi && !out.includes(p)) out.push(p); });
  return out.sort((a, b) => a - b);
}
function brStarts(dur, opts) { const r = brRange(opts); return brGrid(r.lo, r.hi, dur, opts); }
function brStartsAll(dur, opts) { return brGrid(BR_DAY_START, BR_DAY_END, dur, opts); }

function brPick(days, opts) {
  const names = new Set(opts.names), areas = new Set(opts.areas), per = [];
  opts.dayIdx.forEach(di => {
    const seen = new Set(), list = [];
    days[di].recs.forEach(r => {
      const k = nt(r.name);
      if (areas.has(nt(r.area)) && names.has(k) && validShift(r) && !seen.has(k) && !(opts.banned && opts.banned[k] && opts.banned[k].includes(di))) { seen.add(k); list.push(r); }
    });
    per[di] = list;
  });
  return per;
}

function brCaps(opts) { return opts.flex ? [1, 2, 3] : [1]; }

function brPlan(days, opts, rng) {
  BR_OPTS = opts;
  const dur = opts.dur, min = opts.min || 1, per = brPick(days, opts), extra = {};
  if (opts.fixed) Object.keys(opts.fixed).forEach(k => { extra[k] = opts.fixed[k].slice(); });
  const all = new Map();
  opts.dayIdx.forEach(di => per[di].forEach(r => { const k = nt(r.name); if (!all.has(k)) all.set(k, r.name); }));
  const left = new Set(all.keys()), sessions = [];
  const starts = brStarts(dur, opts);
  // primero la regla estricta (1 por cola); si no alcanza el mínimo, se relaja de a poco
  for (const cap of brCaps(opts)) {
    for (let guard = 0; guard < 200 && left.size; guard++) {
      const cands = [];
      opts.dayIdx.forEach(di => {
        const day = days[di], cand = per[di].filter(r => left.has(nt(r.name)));
        if (!cand.length) return;
        const aw = brAways(day, extra[di]);
        const scarcity = r => starts.filter(t => brCheck(day, r, t, t + dur, aw, cap).ok).length;
        const ordered = cand.map(r => ({ r, n: scarcity(r) + (rng ? rng() * 1.5 : 0) })).filter(x => x.n > 0).sort((a, b) => a.n - b.n || a.r.name.localeCompare(b.r.name)).map(x => x.r);
        starts.forEach(t => {
          const A = aw.slice(), members = [];
          ordered.forEach(r => {
            const c = brCheck(day, r, t, t + dur, A, cap);
            if (c.ok) { members.push({ rec: r, soft: c.soft || [] }); A.push({ rec: r, s: t, e: t + dur, why: 'briefing', sc: cap }); }
          });
          if (!members.length) return;
          const near = sessions.length ? Math.min.apply(null, sessions.map(x => Math.abs(t - x.start))) : 0;
          const gap = Math.max(60, dur + 30);
          cands.push({ di, t, members, key: [members.length, opts.spread && sessions.length ? -Math.abs(Math.min(near, 240) - gap) : 0, -brDist(opts, t), -di] });
        });
      });
      let best = null;
      if (cands.length) {
        cands.sort((a, b) => b.key[0] - a.key[0] || b.key[1] - a.key[1] || b.key[2] - a.key[2] || b.key[3] - a.key[3]);
        best = cands[0];
        if (rng) {
          const pool = cands.filter(c => c.members.length >= min && c.members.length >= cands[0].members.length - (rng() < 0.3 ? 1 : 0));
          if (pool.length) { const top = pool.slice(0, 6); best = top[Math.floor(rng() * top.length)]; }
        }
      }
      if (!best || best.members.length < min) break;
      sessions.push({ di: best.di, day: days[best.di], start: best.t, end: best.t + dur, members: best.members, cap });
      extra[best.di] = (extra[best.di] || []).concat(best.members.map(m => ({ rec: m.rec, s: best.t, e: best.t + dur, why: 'briefing', sc: cap })));
      best.members.forEach(m => left.delete(nt(m.rec.name)));
    }
  }
  // quien quedó sin lugar puede sumarse a una sesión ya armada si cabe
  Array.from(left).forEach(k => {
    for (const s of sessions) {
      const r = per[s.di] && per[s.di].find(x => nt(x.name) === k); if (!r) continue;
      const c = brCheck(days[s.di], r, s.start, s.end, brAways(days[s.di], extra[s.di]), s.cap);
      if (c.ok) { s.members.push({ rec: r, soft: c.soft || [] }); extra[s.di].push({ rec: r, s: s.start, e: s.end, why: 'briefing', sc: s.cap || 1 }); left.delete(k); break; }
    }
  });
  sessions.sort((a, b) => a.di - b.di || a.start - b.start);
  const unplaced = [];
  left.forEach(k => unplaced.push(brWhy(days, opts, per, extra, k, all.get(k), starts)));
  return { sessions, unplaced, total: all.size, extra, all, opts };
}

/* prueba muchas combinaciones y se queda con la que mete a más gente en menos sesiones */
function brScore(plan) { return [plan.total - plan.unplaced.length, -plan.sessions.length, -plan.sessions.filter(x => (x.cap || 1) > 1).length]; }

/* recomendaciones con lo que se revisó */
function brRecommend(days, opts, plan) {

    if (g2 > 0) out.push({ kind: 'tip', text: 'Si la hora puede moverse a cualquier hora del día, entran ' + (pt.total - pt.unplaced.length) + ' de ' + pt.total + ' en ' + pt.sessions.length + ' ' + (pt.sessions.length === 1 ? 'sesión' : 'sesiones') + ' (ahora ' + placed + ').' });

  if ((opts.min || 1) <= 1 && singles.length && plan.sessions.length > singles.length) out.push({ kind: 'tip', text: singles.length + ' ' + (singles.length === 1 ? 'sesión queda' : 'sesiones quedan') + ' con una sola persona (' + singles.slice(0, 3).map(s => brFirst(s.members[0].rec.name) + ', ' + s.day.label).join('; ') + '). Si mueven algún break de ese día pueden juntarse con otra sesión.' });

  if (!out.length) out.push({ kind: 'ok', text: 'Todos entran en el horario pedido sin chocar con breaks, colas, Processing ni tasks. No hay nada que mejorar.' });

}


/* ---------- edición manual de personas ---------- */
const brRecFor = (days, di, key) => days[di].recs.find(r => nt(r.name) === key && validShift(r)) || null;

}

/* al quitar a alguien de un día, se le busca otro día u horario donde sí quepa */
function brPlaceMissing(days, plan, opts, onlyKey) {

    plan.sessions.forEach((s, si) => {
      if ((opts.banned[u.key] || []).includes(s.di)) return;
      if (!brFits(days, plan, si, u.key).ok) return;

/* ---------- parche del xlsx (conserva formato) ---------- */
function xmlUnesc(s) { return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&'); }
function attr(tag, name) { const m = tag.match(new RegExp('\\b' + name + '="([^"]*)"')); return m ? xmlUnesc(m[1]) : null; }

function xmlEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function colNum(l) { let n = 0; for (const ch of l) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
function insertCell(xml, addr, cellXml) {
  const m = addr.match(/^([A-Z]+)(\d+)$/), cn = colNum(m[1]);
  const re = new RegExp('(<row r="' + m[2] + '"[^>]*?)(/>|>([\\s\\S]*?)</row>)');
  const rm = xml.match(re);
  if (!rm) return null;
  if (rm[2] === '/>') return xml.replace(re, () => rm[1] + '>' + cellXml + '</row>');

  const rx = /<c r="([A-Z]+)\d+"/g; let mm;
  while ((mm = rx.exec(inner))) { if (colNum(mm[1]) > cn) { pos = mm.index; break; } }
  const ni = inner.slice(0, pos) + cellXml + inner.slice(pos);
  return xml.replace(re, () => rm[1] + '>' + ni + '</row>');
}

async function patchXlsx(buf, edits) {
  const zip = await JSZip.loadAsync(buf);
  const wbXml = await zip.file('xl/workbook.xml').async('string');
  const relXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const rels = {};
  (relXml.match(/<Relationship\b[^>]*>/g) || []).forEach(t => { rels[attr(t, 'Id')] = attr(t, 'Target'); });
  const sheetPath = {};
  (wbXml.match(/<sheet\b[^>]*>/g) || []).forEach(t => {
    const name = attr(t, 'name'), rid = attr(t, 'r:id');
    let tgt = rels[rid]; if (!tgt) return;
    tgt = tgt.replace(/^\//, ''); if (!tgt.startsWith('xl/')) tgt = 'xl/' + tgt;
    sheetPath[name] = tgt;
  });
  const bySheet = {};
  edits.forEach(e => { (bySheet[e.sheet] = bySheet[e.sheet] || []).push(e); });
  let patched = 0;
  for (const [sheet, list] of Object.entries(bySheet)) {
    const p = sheetPath[sheet];
    if (!p || !zip.file(p)) throw new Error('No encontré la hoja “' + sheet + '” dentro del archivo.');
    let xml = await zip.file(p).async('string');
    for (const e of list) {
      const re = new RegExp('<c r="' + e.addr + '"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)');
      const m = xml.match(re);
      const attrs = m ? m[1].replace(/\s+t="[^"]*"/, '') : '';
      let cellXml;
      if (e.text !== undefined) {
        cellXml = e.text === '' ? '<c r="' + e.addr + '"' + attrs + '/>' : '<c r="' + e.addr + '"' + attrs + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(e.text) + '</t></is></c>';
      } else {
        const f = m && m[2] ? (m[2].match(/<f[\s\S]*?<\/f>|<f[^>]*\/>/) || [''])[0] : '';
        cellXml = '<c r="' + e.addr + '"' + attrs + '>' + f + '<v>' + String(e.value) + '</v></c>';
      }
      if (m) xml = xml.replace(re, () => cellXml);
      else { const nx = insertCell(xml, e.addr, cellXml); if (!nx) throw new Error('No encontré dónde poner la celda ' + e.addr + ' en ' + sheet + '.'); xml = nx; }
      patched++;
    }
    zip.file(p, xml);
  }
  const out = await zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
  return { data: out, patched };
}

function collectEdits(days) {
  const edits = [];
  days.forEach(d => d.recs.forEach(r => {
    if (r.end !== r.oe && r.end != null) edits.push({ sheet: d.sheetName, addr: r.ae, value: r.end / 1440 });
    if (r.b1 !== r.o1 && r.b1 != null) edits.push({ sheet: d.sheetName, addr: r.a1, value: r.b1 / 1440 });
    if (r.b2 !== r.o2 && r.b2 != null) edits.push({ sheet: d.sheetName, addr: r.a2, value: r.b2 / 1440 });
    if (r.task !== r.ot) edits.push({ sheet: d.sheetName, addr: r.at, text: r.task });
    if (r.queue !== r.oq) edits.push({ sheet: d.sheetName, addr: r.aq, text: r.queue });
  }));
  return edits;
}

const bTolText = () => (BR_TOL.find(x => x[0] === B.tolKey) || BR_TOL[2])[1].toLowerCase();

function bWin(){
  if (B.mode === 'am') return { lo: B.start, hi: 840 };
  if (B.mode === 'pm') return { lo: B.start, hi: 1380 };
  if (B.mode === 'both') return { lo: B.start, hi: 1380 };
  if (B.mode === 'custom') return { lo: B.winFrom, hi: B.winTo };
  return null;
}
function bTimeOk(){
  const w = bWin(); if (!w) return true;

}
function bWhenText(){

function bTimeIn(id, label, val, key){ return '<div class="bfield"><label for="' + id + '">' + label + '</label><input class="binput small" type="time" id="' + id + '" data-b="' + key + '" value="' + fmt24(val) + '" step="900"></div>'; }

/* motivo en lenguaje sencillo para las personas que faltan */
function bWhyText(u){
  const out = []; let turno = 0;
  (u.reasons || []).forEach(r => {
    if (/^sí cabe solo/.test(r)) out.push('Puede asistir, pero no hay otras personas que quepan a la misma hora respetando las reglas (1 por cola y 1 de Processing)');
    else if (/no cubre ese horario/.test(r)) turno++;
    else out.push(r.charAt(0).toUpperCase() + r.slice(1));
  });
  if (turno) out.push(turno > 1 ? 'En los días elegidos su turno no coincide con el horario del training' : 'Su turno no coincide con el horario del training');
  return Array.from(new Set(out)).join('. ') || 'Sin hueco';
}

const bIni = n => String(n).split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function bMax(){

  return m;
}

function bBuildPeople(){
  const want = new Set(B.areas.map(nt)), map = new Map();
  B.days.forEach((d, di) => d.recs.forEach(r => {
    if (!want.has(nt(r.area)) || !validShift(r)) return;
    const k = nt(r.name);
    if (!map.has(k)) map.set(k, { key: k, name: r.name, area: r.area, queue: r.queue, task: '', days: [], on: true });
    const p = map.get(k);
    if (!p.days.includes(di)) p.days.push(di);
    if (!p.task && mainText(r)) p.task = mainText(r);
  }));
  B.people = Array.from(map.values()).sort((a, b) => a.area.localeCompare(b.area) || a.name.localeCompare(b.name));
  B.dayOn = B.days.map((d, di) => B.people.some(p => p.days.includes(di)));
}

async function bLoad(file){
  B.err = '';
  try{
    if (!/\.xlsx$/i.test(file.name)) throw new Error('Necesito un archivo .xlsx. Si es .xlsm o .xls, guarda una copia como .xlsx y súbela.');
    const buf = await file.arrayBuffer();
    const out = parseWorkbook(XLSX.read(buf, { type: 'array' }));
    if (!out.days.length) throw new Error('No encontré hojas con la tabla de breaks (la fila con “Break 1”). ¿Es el archivo de Tasks del día?');
    B.days = out.days; B.fname = file.name; B.plan = null; B.approved = false;
    bBuildPeople();
    if (!B.people.length){
      const found = Array.from(new Set([].concat.apply([], B.days.map(d => d.recs.map(r => r.area))))).filter(Boolean).sort();
      throw new Error('No encontré personas de ' + B.areas.join(', ') + ' en ese archivo. Áreas que sí aparecen: ' + found.join(', ') + '.');
    }
    B.step = 5;
  }catch(e){ B.err = e && e.message ? e.message : 'No pude leer el archivo.'; B.step = 4; }
  render();
}

function bAnalyze(){
  const names = B.people.filter(p => p.on).map(p => p.key);
  const dayIdx = B.dayOn.map((on, i) => on ? i : -1).filter(i => i >= 0);
  if (!names.length || !dayIdx.length){ toast('Elige al menos una persona y un día.'); return; }
  const w = bWin();
  B.opts = { dur: B.dur, start: B.mode === 'custom' ? B.winFrom : B.start, start2: B.mode === 'both' ? B.start2 : null, winLo: w ? w.lo : null, winHi: w ? w.hi : null, tol: bTol(), min: B.min, flex: B.flex, spread: B.spread && B.mode !== 'margin', dayIdx, banned: {}, names, areas: B.areas.map(nt) };
  B.plan = brPlanBest(B.days, B.opts, 900);
  brValidate(B.days, B.plan, B.opts);
  B.recs = brRecommend(B.days, B.opts, B.plan);
  B.approved = false; B.edit = false; B.step = 6; render();
  window.scrollTo(0, 0);
}

  const sum = 'Entran ' + placed + ' de ' + P.total + ' ' + pl(P.total, 'persona', 'personas') + ' en ' + P.sessions.length + ' ' + pl(P.sessions.length, 'sesión', 'sesiones') + ' de ' + B.dur + ' min.' + (P.unplaced.length ? ' Faltan ' + P.unplaced.length + ' sin horario.' : ' Todos tienen horario.');
  const byDay = {};
  P.sessions.forEach((s, si) => { (byDay[s.di] = byDay[s.di] || []).push([s, si]); });
  let idx = 0;

    '<div class="bday" style="--dc:' + DAYC[di % DAYC.length] + '"><h3><i></i>' + esc(bDayName(B.days[di])) + '</h3><div class="dstrip" aria-hidden="true"><span class="dsm">Mañana</span><span class="dst">Tarde</span>' + byDay[di].map(x => '<i style="left:' + ((x[0].start - 360) / 1020 * 100) + '%;width:' + Math.max(1.6, (x[0].end - x[0].start) / 1020 * 100) + '%"></i>').join('') + '</div>' + byDay[di].map(x => bSessHTML(x[0], x[1], idx++)).join('') + '</div>').join('');
  let newForm = '';
  if (B.edit){
    const dopts = B.days.map((d, i) => B.dayOn[i] ? '<option value="' + i + '">' + esc(bDayName(d)) + '</option>' : '').join('');
    newForm = '<div class="bnew"><b>Nueva sesión</b><select class="bsel" id="b-newday" aria-label="Día">' + dopts + '</select><input class="bsel" type="time" id="b-newtime" value="' + fmt24(B.start) + '" step="900" aria-label="Hora de inicio"><button class="btn small" data-act="b-newsess">Crear sesión vacía</button></div>';
  }
  const un = P.unplaced.length ? '<div class="bun bfalta"><h3>Personas que faltan por agendar (' + P.unplaced.length + ')</h3><ul>' + P.unplaced.map(u => {
    let ctl = '';
    if (B.edit){
      const opts = P.sessions.map((x, xi) => { const f = brFits(B.days, P, xi, u.key); return f.none ? '' : '<option value="' + xi + '">' + esc(bSessLabel(x)) + (f.ok ? '' : ' (choca)') + '</option>'; }).join('');
      ctl = '<span class="sctl"><select class="bsel" data-b="assign" data-k="' + esc(u.key) + '" aria-label="Asignar a una sesión"><option value="">Asignar a…</option>' + opts + '</select></span>';
    }
    return '<li><span><b>' + esc(u.name) + '</b>' + (u.rec ? ' <span class="pq" style="--q:' + bQcol(u.rec.queue) + '">' + esc(u.rec.queue || 'sin cola') + '</span> <span class="sm">' + esc(u.rec.area) + '</span>' : '') + '<br>' + esc(bWhyText(u)) + (u.alt ? '. Podría el ' + esc(B.days[u.alt.di].label) + ' a las ' + fmt(u.alt.t) + '.' : '.') + '</span>' + ctl + '</li>';
  }).join('') + '</ul><div class="bfoot"><button class="btn primary" data-act="b-again">Agendar otro training solo con ellos</button><span class="bhint tight">Deja marcadas únicamente a estas personas para el siguiente training. También quedan en la hoja “Faltan” del Excel.</span></div></div>' : '<div class="bun bokbox"><h3>Nadie falta</h3><p>Todas las personas elegidas tienen horario.</p></div>';
  const live = bLive();
  const warns = live.length ? '<div class="bun warnbox"><h3>Avisos de las sesiones</h3><ul>' + live.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' : '';
  const recs = '<div class="brecs"><h3>Recomendaciones</h3><ul>' + B.recs.map(r => '<li class="' + r.kind + '"><span class="rd"></span><span>' + esc(r.text) + '</span></li>').join('') + '</ul></div>';
  const relaxed = P.sessions.filter(s => (s.cap || 1) > 1).length;
  return '<section class="bres"><div class="bhero"><div class="bhtop"><div><h2>' + esc(B.title) + '</h2><p class="bsub">' + esc(B.areas.join(', ')) + ', ' + B.dur + ' min, ' + esc(bWhenText()) + ', mínimo ' + B.min + '</p></div><span class="bbadge ' + (B.approved ? 'ok' : 'wait') + '">' + (B.approved ? 'Aprobado' : 'Pendiente de aprobación') + '</span></div>' +
    '<div class="bmeter" role="img" aria-label="' + pct + '% con horario"><i style="width:' + pct + '%"></i></div><p class="bsum">' + esc(sum) + '</p>' +
    '<div class="bflags">' + (B.edit ? '<span class="sbadge warn">Modo edición activo</span>' : '') + (relaxed ? '<span class="sbadge warn">' + relaxed + ' ' + pl(relaxed, 'sesión', 'sesiones') + ' con regla relajada</span>' : '') + '</div></div>' +
    (days || '<p class="bhint">No se pudo armar ninguna sesión con estos datos. Mira las recomendaciones.</p>') + newForm + warns + recs + un + '</section>';

function bBarHTML(){
  if (B.step !== 6) return '';
  const nw = bLive().length;
  const dl = S.dl === null ? '<span style="font-size:13px;color:var(--bad)">Este visor no permite descargar archivos; abre la página en claude.ai.</span>' :
    '<button class="btn" data-act="b-pdf">Descargar PDF</button><button class="btn primary" data-act="b-xlsx">Descargar Excel</button>';
  return '<div class="exportBar"><div class="msg"><b>' + (B.approved ? 'Briefing aprobado' : 'Listo para aprobar') + '</b> ' + (nw ? 'Ojo: hay ' + nw + ' ' + pl(nw, 'aviso', 'avisos') + ' en las sesiones.' : (B.approved ? 'Ya puedes descargarlo con el sello de aprobado.' : 'Revísalo y apruébalo; el PDF y el Excel llevan el estado.')) + '</div>' +
    '<button class="btn" data-act="b-edit-toggle" aria-pressed="' + B.edit + '">' + (B.edit ? 'Terminar edición' : 'Editar personas') + '</button><button class="btn" data-act="b-edit">Cambiar datos</button><button class="btn ' + (B.approved ? '' : 'apply') + '" data-act="b-approve">' + (B.approved ? 'Quitar aprobación' : 'Aprobar') + '</button>' + dl + '</div>';
